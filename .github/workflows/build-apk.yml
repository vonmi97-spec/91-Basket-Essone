name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Basket91-Essonne.apk

      - name: Envoyer l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Basket91-Essonne
          path: Basket91-Essonne.apk

      - name: Publier la release (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 91 Basket Essonne v1.0.${{ github.run_number }}
          files: Basket91-Essonne.apk

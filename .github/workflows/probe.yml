name: Test API FFBB
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/probe.py
      - run: echo | openssl s_client -connect api.ffbb.app:443 -servername api.ffbb.app -showcerts 2>/dev/null | grep -E "^ ?[0-9] s:|i:" 

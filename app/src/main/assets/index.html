/* ================= Probabilité de victoire d'un match ================= */
S.rateCache = {};
function teamRating(t, m){
  const ctx = {cat: m.cat.code, sexe: m.sexe};
  const key = norm(t.nom) + "|" + ctxStr(m.cat, m.sexe);
  if (S.rateCache[key]) return S.rateCache[key];
  const g = playedOf(t.nom, null, ctx, t.clubId);
  const sum = g.reduce((s, x) => s + (x.pf - x.pa), 0);
  return (S.rateCache[key] = {r: sum / (g.length + 2), n: g.length, w: g.filter(x => x.pf > x.pa).length});
}
function winProb(m){
  if (m.joue) return null;
  const a = teamRating(m.t1, m), b = teamRating(m.t2, m);
  if (!a.n && !b.n) return null;
  const p = 1 / (1 + Math.exp(-((a.r + HOME_ADV) - b.r) / SPREAD));
  return {p1: p, p2: 1 - p, a, b, low: Math.min(a.n, b.n) < 3};
}
function wpBar(m){
  const w = winProb(m); if (!w) return "";
  const p1 = Math.round(w.p1 * 100), p2 = 100 - p1;
  return `<div class="wp" title="Probabilité de victoire"><b class="${p1 >= p2 ? "fav" : ""}">${p1} %</b><div class="wpbar"><i style="width:${p1}%"></i></div><b class="${p2 > p1 ? "fav" : ""}">${p2} %</b></div>`;
}
function wpDetail(m){
  const w = winProb(m); if (!w) return "";
  const f = v => (v > 0 ? "+" : "") + (Math.round(v * 10) / 10).toLocaleString("fr-FR");
  const p1 = Math.round(w.p1 * 100);
  return `<div class="kv"><span class="k">Probabilité de victoire</span><span style="flex:1">${wpBar(m)}
    <span class="stat">${esc(m.t1.nom)} : ${w.a.w} V / ${w.a.n} matchs, écart ${f(w.a.r)} · ${esc(m.t2.nom)} : ${w.b.w} V / ${w.b.n} matchs, écart ${f(w.b.r)} · avantage du terrain ${HOME_ADV} pts${w.low ? " · ⚠️ peu de matchs : estimation fragile" : ""}</span></span></div>`;
}

  const pvb = e.target.closest("[data-pv],[data-erase]");
  if (pvb){
    if (pvb.dataset.erase){ eraseAll(+pvb.dataset.erase); return; }
    if (pvb.dataset.pv === "ok" || pvb.dataset.pv === "more"){ store.set("privacyOk", true); const n = $("pvNotice"); if (n) n.remove(); }
    if (pvb.dataset.pv === "more") showPrivacy();
    return;
  }
  const sy = e.target.closest("[data-style]");
  if (sy){ e.stopPropagation(); showTeamStyle(sy.dataset.style, sy.dataset.sctx, sy.dataset.sclub); return; }
  const th = e.target.closest("[data-theme]");
  if (th){ setThemePref(th.dataset.theme); document.querySelectorAll("[data-theme]").forEach(b => b.classList.toggle("on", b === th)); return; }
  const lk = e.target.closest("[data-url]");
  if (lk){ e.preventDefault(); e.stopPropagation(); openUrl(lk.dataset.url); return; }
  const hm = e.target.closest("[data-home]");
  if (hm){ S.homeAll = hm.dataset.home === "all"; renderMain(); return; }
  const nd = e.target.closest("[data-nbaday]");
  if (nd){ const k = +nd.dataset.nbaday; if (k){ const d = new Date(S.nbaDay || nbaDefaultDay()); d.setDate(d.getDate() + k); S.nbaDay = d; } loadNba(); return; }
  const nb = e.target.closest("[data-notif]");
  if (nb){ handleNotifClick(nb.dataset.notif); return; }
  const la = e.target.closest("[data-liveall]");
  if (la){ S.liveAll = la.dataset.liveall === "1"; renderMain(); return; }
  const um = e.target.closest("[data-upmode]");
  if (um){ S.upMode = um.dataset.upmode; renderMain(); return; }
  const pv = e.target.closest("[data-pview],[data-pj]");
  if (pv){
    const r = S.ranks[pv.dataset.pk]; if (!r) return;
    if (pv.dataset.pview) r.view = pv.dataset.pview; else r.j = +pv.dataset.pj;
    renderMain(); return;
  }
  const pl = e.target.closest("[data-poule],[data-poule-retry]");
  if (pl){
    const pk = pl.dataset.poule || pl.dataset.pouleRetry; const p = pouleFromKey(pk);
    if (pl.dataset.pouleRetry){ loadRanking(pk, p.id, p); return; }
    S.open[pk] = !S.open[pk];
    if (S.open[pk] && (!S.ranks[pk] || S.ranks[pk].error)) loadRanking(pk, p.id, p); else renderMain();
    return;
  }
  const el = e.target.closest("[data-cat],[data-sexe],[data-tab],[data-go],[data-fav],[data-club],[data-clearclub],.match,#saveSet,#resetSet");
  if (e.target.id === "sheet"){ closeSheet(); return; }
  if (!el) return;
  if (el.id === "saveSet"){ store.set("placesMontee", Math.max(1, +$("setPlaces").value || 1)); store.set("placesDescente", Math.max(1, +$("setDown").value || 1)); const nom = $("setNom").value.trim(), id = $("setId").value.trim(); store.set("comite", (nom||id) ? {nom: nom||undefined, id: id||undefined, manual: true} : null); closeSheet(); reload(); return; }
  if (el.id === "resetSet"){ store.set("comite", null); closeSheet(); reload(true); return; }
  if (el.dataset.cat){ S.cat = el.dataset.cat; render(); return; }
  if (el.dataset.sexe){ S.sexe = el.dataset.sexe; render(); return; }
  if (el.dataset.clearclub){ S.club = null; render(); return; }
  if (el.dataset.tab){ const wasRes = S.tab === "res"; S.tab = el.dataset.tab; if (wasRes !== (S.tab === "res")) S.cat = "ALL"; if ((S.tab === "cls" || S.tab === "up" || S.tab === "sty") && !S.results) loadResults(); if (S.tab === "live") startLive(); else stopLive(); if (S.tab === "nba") loadNba(); document.body.classList.toggle("nba", S.tab === "nba"); document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t===el)); renderChips(); renderMain(); return; }
  if (el.dataset.go){ e.stopPropagation(); const m = findMatch(el.dataset.go); if (m) openUrl(mapsUrl(m)); return; }
  if (el.dataset.fav){
    e.stopPropagation(); const k = el.dataset.fav;
    const i = S.favs.findIndex(f => f.key === k);
    if (i >= 0) S.favs.splice(i,1); else S.favs.push({key:k, nom: el.dataset.favname});
    store.set("favs", S.favs); const on = i < 0;
    document.querySelectorAll(`[data-fav="${CSS.escape(k)}"]`).forEach(b => { b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; });
    if (k.startsWith("nba:") && S.tab === "nba") renderNba();
    syncNotif(); if (on && !k.startsWith("nba:")) setTimeout(() => proposeNotif(el.dataset.favname), 400);
    if (S.tab === "favs") renderMain(); return;
  }
  if (el.dataset.club !== undefined){ if (el.dataset.club){ S.club = el.dataset.club; S.tab = "matchs"; document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab==="matchs")); render(); window.scrollTo(0,0); } return; }
  if (el.classList.contains("match")){ showMatch(el.dataset.id); }
});
$("prevW").onclick = () => { S.offset--; reload(); };
$("nextW").onclick = () => { S.offset++; reload(); };
$("btnRefresh").onclick = () => refreshAll();
$("btnSettings").onclick = showSettings;
$("btnNotif").onclick = () => showNotifSheet();
let qT; $("q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; renderMain(); }, 150); showSugg(); });
/* ===== Suggestions : liste des équipes et des gymnases ===== */
function suggSource(){
  const teams = {}, gyms = {};
  const pool = allKnown().concat(S.season || []);
  pool.forEach(m => {
    [m.t1, m.t2].forEach(t => {
      const k = norm(t.nom) + "|" + m.cat.code + "|" + (m.sexe || "");
      if (!teams[k]) teams[k] = {type: "team", nom: t.nom, sub: prettyCat(m.cat) + (m.sexe ? " " + sexLabel(m.sexe).toLowerCase() : ""), t, ord: catSortKey(m.cat)};
    });
    if (m.salle && m.salle.nom){
      const k = norm(m.salle.nom) + "|" + norm(m.salle.ville);
      if (!gyms[k]) gyms[k] = {type: "gym", nom: m.salle.nom, sub: m.salle.ville || "", n: 0};
      gyms[k].n++;
    }
  });
  return {teams: Object.values(teams), gyms: Object.values(gyms)};
}
function showSugg(){
  const box = $("sugg"), q = $("q").value;
  if (S.tab === "nba"){ box.hidden = true; return; }
  const words = norm(q).split(/\s+/).filter(Boolean);
  const ok = x => !words.length || words.every(w => norm(x.nom + " " + x.sub).includes(w));
  const src = suggSource();
  const teams = src.teams.filter(ok).sort((a,b) => a.nom.localeCompare(b.nom) || a.ord - b.ord);
  const gyms = src.gyms.filter(ok).sort((a,b) => a.nom.localeCompare(b.nom));
  if (!teams.length && !gyms.length){ box.innerHTML = `<div class="sg-empty">Aucune équipe ni gymnase trouvé</div>`; box.hidden = !words.length; return; }
  const max = words.length ? 40 : 300;
  box.innerHTML =
    (teams.length ? `<div class="sg-h">🏀 Équipes (${teams.length})</div>` + teams.slice(0, max).map(x => `<button class="sg" data-sg="${esc(x.nom)}">${logoHtml(x.t)}<span><b>${esc(x.nom)}</b><small>${esc(x.sub)}</small></span></button>`).join("") : "") +
    (gyms.length ? `<div class="sg-h">📍 Gymnases (${gyms.length})</div>` + gyms.slice(0, max).map(x => `<button class="sg" data-sg="${esc(x.nom)}"><span class="sg-ic">📍</span><span><b>${esc(x.nom)}</b><small>${esc(x.sub)}</small></span></button>`).join("") : "");
  box.hidden = false;
}
function hideSugg(){ $("sugg").hidden = true; }
$("q").addEventListener("focus", showSugg);
$("q").addEventListener("keydown", e => { if (e.key === "Escape" || e.key === "Enter"){ hideSugg(); $("q").blur(); } });
document.addEventListener("click", e => {
  const it = e.target.closest("[data-sg]");
  if (it){
    e.stopPropagation();
    $("q").value = it.dataset.sg; S.q = it.dataset.sg; hideSugg(); $("q").blur();
    if (S.tab === "matchs" && !S.homeAll) S.homeAll = true;   // afficher tous les matchs de l'équipe ou du gymnase
    renderMain(); return;
  }
  if (!e.target.closest(".search")) hideSugg();
}, true);
$("q").addEventListener("search", () => { if (!$("q").value){ S.q = ""; renderMain(); } });

function render(){ renderWeek(); renderChips(); renderMain(); }

const cache = {};
/* ================= Rafraîchir (bouton ⟳ et glisser vers le bas) ================= */
let refreshing = false, toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
async function refreshAll(){
  if (refreshing) return; refreshing = true;
  $("btnRefresh").classList.add("spin"); $("ptr").classList.add("spin");
  const before = new Set(allKnown().filter(m => m.joue).map(m => m.id));
  try{
    Object.keys(cache).forEach(k => delete cache[k]);       // on oublie tout ce qui était en mémoire
    try{ localStorage.removeItem("tokens"); }catch(e){}
    if (S.tab === "nba"){ await loadNba(true); }
    else {
      const ms = await loadMatches(weekendRange(S.offset));
      cache["w" + S.offset] = ms; S.matches = ms; S.error = null;
      if (S.results || S.tab === "res"){ S.results = null; await loadResults(true); }
      if (S.tab === "cls" || S.tab === "up" || S.tab === "sty" || S.tab === "favs"){ S.ranks = {}; }
      if (S.season) await loadSeason(true);
      if (S.matches.some(m => isLiveMatch(m, Date.now()))) await refreshLiveMap();
      refreshNbaHome();
    }
    const fresh = allKnown().filter(m => m.joue && !before.has(m.id)).length;
    render();
    const hr = new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    toast(S.tab === "nba" ? `NBA à jour (${hr})` : fresh ? `✅ ${fresh} nouveau${fresh>1?"x":""} résultat${fresh>1?"s":""} · ${hr}` : `À jour · ${hr}`);
  }catch(e){ toast("⚠️ Impossible d'actualiser : " + (e.message || e)); }
  finally{ refreshing = false; $("btnRefresh").classList.remove("spin"); $("ptr").classList.remove("spin"); $("ptr").style.transform = ""; }
}
window.refreshAll = refreshAll;
(function(){
  let y0 = null, pulled = 0;
  document.addEventListener("touchstart", e => { if (window.scrollY <= 0 && !$("sheet").classList.contains("on") && (!$("splash") || $("splash").classList.contains("gone"))) y0 = e.touches[0].clientY; else y0 = null; }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (y0 == null || refreshing) return;
    pulled = Math.max(0, e.touches[0].clientY - y0);
    if (pulled > 5 && window.scrollY <= 0) $("ptr").style.transform = `translate(-50%, ${Math.min(pulled * 0.6, 90) - 50}px) rotate(${pulled * 2}deg)`;
  }, {passive: true});
  document.addEventListener("touchend", () => {
    if (y0 == null) return;
    if (pulled > 90 && !refreshing){ $("ptr").style.transform = "translate(-50%, 30px)"; refreshAll(); }
    else if (!refreshing) $("ptr").style.transform = "";
    y0 = null; pulled = 0;
  });
})();
async function reload(force){
  const key = "w" + S.offset;
  renderWeek();
  if (!force && cache[key]){ S.matches = cache[key]; S.error = null; S.cat = "ALL"; render(); return; }
  S.loading = true; S.error = null; S.cat = "ALL"; S.club = null; renderChips(); renderMain();
  const myOffset = S.offset;
  try{
    const ms = await loadMatches(weekendRange(S.offset));
    if (myOffset !== S.offset) return;
    cache[key] = ms; S.matches = ms; syncNotif(); S.rateCache = {};
    if (!S.season) setTimeout(() => loadSeason(), 500);
    store.set("last_" + key, {t: Date.now(), n: ms.length});
  }catch(err){
    if (myOffset !== S.offset) return;
    S.error = (err && err.message) || String(err); S.matches = [];
  }finally{
    if (myOffset === S.offset){ S.loading = false; render(); }
  }
}
window.reload = reload; window.closeSheet = closeSheet;
setTimeout(() => { privacyNotice(); if (store.get("privacyOk", false) || store.get("lastVersion", null)) checkNews(); else store.set("lastVersion", appVersion()); }, 3800);
reload();
</script>

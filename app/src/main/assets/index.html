@keyframes spRim{0%,53%{transform:rotate(0)} 57%{transform:rotate(-9deg)} 66%{transform:rotate(4deg)} 74%{transform:rotate(-2deg)} 82%,100%{transform:rotate(0)}}

@keyframes spTitle{to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash{animation-delay:.6s}.sp-player,.sp-body,.sp-ball,.sp-shadow,.sp-rim,.sp-net,.sp-dunk{animation-duration:.01s}}
#ptr{position:fixed;left:50%;top:0;z-index:60;transform:translate(-50%,-60px);width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--orange2);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s}

<script>
"use strict";
/* ================= Config ================= */
const API = "https://api.ffbb.app/";
const MEILI = "https://meilisearch-prod.ffbb.app/";
const IDX_R = "ffbbserver_rencontres";
const IDX_O = "ffbbserver_organismes";
const CAT_ORDER = ["U7","U9","U11","U13","U15","U17","U18","U20","U21","SE","SEN","SENIORS","VET","LOISIR"];

/* ================= Stockage ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= HTTP (pont natif ou fetch) ================= */
let reqSeq = 0; const pending = {};
window.__nativeCb = function(id, status, text){
  const p = pending[id]; if(!p) return; delete pending[id];
  p({status, text});
};
function http(method, url, headers, body){
  if (window.AndroidBridge && window.AndroidBridge.request && !window.__useWebFetch){
    return new Promise(res => {
      const id = "r" + (++reqSeq); pending[id] = res;
      window.AndroidBridge.request(id, method, url, JSON.stringify(headers||{}), body||"");
    }).then(r => {
      // échec natif (certificat…) : on retente via le moteur du navigateur
      if (r.status === 0) return webFetch(method, url, headers, body).then(w => { if (w.status) window.__useWebFetch = true; return w.status ? w : r; });
      return r;
    });
  }
  return webFetch(method, url, headers, body);
}
function webFetch(method, url, headers, body){
  return fetch(url, {method, headers, body: body||undefined})
    .then(r => r.text().then(t => ({status:r.status, text:t})))
    .catch(e => ({status:0, text:"Erreur réseau : "+e.message}));
}
async function httpJson(method, url, headers, body){
  const r = await http(method, url, headers, body);
  if (r.status < 200 || r.status >= 300) {
    const e = new Error("HTTP " + r.status + " — " + (r.text||"").slice(0,200)); e.status = r.status; throw e;
  }
  return JSON.parse(r.text);
}

/* ================= Jetons FFBB ================= */
async function getTokens(force){
  const c = store.get("tokens", null);
  if (!force && c && c.ms && Date.now() - c.t < 6*3600e3) return c;
  const j = await httpJson("GET", API + "items/configuration", {});
  const d = j && j.data ? j.data : j;
  const t = { ms: d.key_ms, dh: d.key_dh, t: Date.now() };
  if (!t.ms) throw new Error("Jeton de recherche FFBB introuvable");
  store.set("tokens", t); return t;
}
async function multiSearch(queries, retried){
  const tk = await getTokens(retried);
  try{
    const j = await httpJson("POST", MEILI + "multi-search",
      {"Authorization":"Bearer " + tk.ms, "Content-Type":"application/json"},
      JSON.stringify({queries}));
    return j.results || [];
  }catch(e){
    if (!retried && (e.status === 401 || e.status === 403)) return multiSearch(queries, true);
    throw e;
  }
}
const q = s => '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';

/* ================= Week-end ================= */
function weekendRange(offset){
  const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const wd = d.getDay(); // 0 dim … 6 sam
  // vendredi de référence : si on est ven/sam/dim → ce week-end, sinon le prochain
  let toFri = 5 - wd; if (wd === 6) toFri = -1; if (wd === 0) toFri = -2;
  const fri = new Date(d); fri.setDate(d.getDate() + toFri + offset*7);
  const end = new Date(fri); end.setDate(fri.getDate() + 2); end.setHours(23,59,59,999);
  return { start: fri, end };
}
function fmtDay(d){ return d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}); }
function fmtShort(d){ return d.toLocaleDateString("fr-FR",{day:"numeric", month:"short"}); }

/* ================= Comité organisateur (Essonne) ================= */
async function findComite(range){
  const saved = store.get("comite", null);
  if (saved && (saved.id || saved.nom)) return saved;
  // 1) annuaire des organismes
  try{
    const [r] = await multiSearch([{indexUid: IDX_O, q: "comite essonne", limit: 30}]);
    const hit = (r && r.hits || []).find(h => /comit/i.test(h.nom||"") && /essonne/i.test(h.nom||""));
    if (hit){ const c = {id: String(hit.id), nom: hit.nom}; store.set("comite", c); return c; }
  }catch(e){ /* on tente la méthode suivante */ }
  // 2) organisateurs présents sur la période
  const tf = tsFilter(range);
  const [r2] = await multiSearch([{indexUid: IDX_R, q: "", limit: 0, filter: [tf], facets: ["organisateur.nom"]}]);
  const names = Object.keys((r2 && r2.facetDistribution && r2.facetDistribution["organisateur.nom"]) || {});
  const nm = names.find(n => /essonne/i.test(n)) || names.find(n => /\b91\b/.test(n));
  if (nm){ const c = {nom: nm}; store.set("comite", c); return c; }
  throw new Error("Comité de l'Essonne introuvable dans les données FFBB. Renseigne son nom dans ⚙️ Réglages.");
}
function tsFilter(range){
  // le timestamp peut être en secondes ou millisecondes : on couvre les deux (+/- 3 h de marge)
  const a = Math.floor(range.start.getTime()/1000) - 3*3600, b = Math.floor(range.end.getTime()/1000) + 3*3600;
  const f = "date_rencontre_timestamp";
  return `(${f} >= ${a} AND ${f} <= ${b}) OR (${f} >= ${a*1000} AND ${f} <= ${b*1000})`;
}
function comiteFilter(c){
  const parts = [];
  if (c.id) parts.push(`organisateur.id = ${q(c.id)}`);
  if (c.nom) parts.push(`organisateur.nom = ${q(c.nom)}`);
  return parts.join(" OR ");
}

/* ================= Chargement des matchs ================= */
async function loadMatches(range){
  let comite = await findComite(range);
  let res = await fetchMatches(range, comite);
  if (!res.length && range.end < new Date()){
    // le moteur de recherche FFBB ne garde que ~1 semaine : on interroge la base FFBB pour les week-ends plus anciens
    try{ res = await fetchMatchesDirectus(range, comite); }catch(e){ S.oldErr = e.message || String(e); }
    return res;
  }
  if (!res.length && !comite.manual){
    // la détection via l'annuaire a pu donner un nom/ID différent : on tente via les organisateurs de la période
    const tf = tsFilter(range);
    const [r2] = await multiSearch([{indexUid: IDX_R, q: "", limit: 0, filter: [tf], facets: ["organisateur.nom"]}]);
    const names = Object.keys((r2 && r2.facetDistribution && r2.facetDistribution["organisateur.nom"]) || {});
    const nm = names.find(n => /essonne/i.test(n));
    if (nm && nm !== comite.nom){ comite = {nom: nm}; store.set("comite", comite); res = await fetchMatches(range, comite); }
  }
  return res;
}
const RENC_FIELDS = ["id","date","date_rencontre","horaire","numeroJournee","nomEquipe1","nomEquipe2","resultatEquipe1","resultatEquipe2","joue",
  "competitionId.id","competitionId.nom","competitionId.code","competitionId.sexe","competitionId.categorie.code","competitionId.categorie.libelle","competitionId.categorie.ordre",
  "idPoule.id","idPoule.nom","salle.libelle","salle.adresse","salle.cartographie.ville","salle.cartographie.codePostal","salle.cartographie.latitude","salle.cartographie.longitude",
  "idOrganismeEquipe1.id","idOrganismeEquipe1.nom","idOrganismeEquipe1.code","idOrganismeEquipe1.logo",
  "idOrganismeEquipe2.id","idOrganismeEquipe2.nom","idOrganismeEquipe2.code","idOrganismeEquipe2.logo"];
function isoLocal(d){ const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
async function fetchMatchesDirectus(range, comite){
  if (!comite.id) throw new Error("ID du comité inconnu");
  const filter = JSON.stringify({_and: [
    {competitionId: {organisateur: {_eq: comite.id}}},
    {date_rencontre: {_between: [isoLocal(range.start), isoLocal(range.end)]}}
  ]});
  const j = await directusGet("items/ffbbserver_rencontres", RENC_FIELDS, ["limit=2000", "filter=" + encodeURIComponent(filter)]);
  return ((j && j.data) || []).map(normalize).filter(m => m.date && m.date >= range.start && m.date <= range.end);
}
async function fetchMatches(range, comite){
  const filter = [tsFilter(range), comiteFilter(comite)];
  let all = [], offset = 0, total = Infinity;
  while (offset < total && offset < 3000){
    const [r] = await multiSearch([{indexUid: IDX_R, q: "", limit: 500, offset, filter}]);
    const hits = (r && r.hits) || [];
    all = all.concat(hits);
    total = r && (r.estimatedTotalHits != null ? r.estimatedTotalHits : r.totalHits != null ? r.totalHits : hits.length);
    if (hits.length < 500) break;
    offset += 500;
  }
  return all.map(normalize).filter(m => m.date && m.date >= new Date(range.start.getTime()) && m.date <= range.end);
}

/* ================= Normalisation ================= */
function logoId(x){
  if (!x) return null;
  if (typeof x === "string") return x;
  if (typeof x === "object") return x.id || null;
  return null;
}
function parseDate(h){
  let s = h.date_rencontre || h.date;
  if (s){
    const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ","T"));
    if (!isNaN(d)) {
      // si l'heure est 00:00 et "horaire" est fourni (ex. 1530)
      if (d.getHours()===0 && d.getMinutes()===0 && h.horaire && /^\d{3,4}$/.test(String(h.horaire))){
        const hh = String(h.horaire).padStart(4,"0"); d.setHours(+hh.slice(0,2), +hh.slice(2));
      }
      return d;
    }
  }
  let t = h.date_rencontre_timestamp; if (t){ if (t < 1e11) t *= 1000; return new Date(t); }
  return null;
}
function catOf(h){
  const c = (h.competitionId && h.competitionId.categorie) || {};
  let code = (c.code || "").toUpperCase();
  if (!code){
    const m = /(U\d{1,2})/i.exec((h.competitionId && h.competitionId.nom) || "");
    code = m ? m[1].toUpperCase() : ((/senior/i.test((h.competitionId && h.competitionId.nom)||"")) ? "SE" : "Autre");
  }
  return { code, libelle: c.libelle || code, ordre: c.ordre != null ? +c.ordre : null };
}
function sexeOf(h){
  const s = ((h.competitionId && h.competitionId.sexe) || h.sexe || "").toString().toLowerCase();
  if (s.startsWith("f")) return "F"; if (s.startsWith("m")) return "M"; if (s.startsWith("x")||s.includes("mixte")) return "X";
  return "";
}
function team(h, n){
  const org = h["idOrganismeEquipe"+n] || {}; const eng = h["idEngagementEquipe"+n] || {};
  return {
    nom: h["nomEquipe"+n] || eng.nom || org.nom || "?",
    club: org.nom || "", clubId: org.id ? String(org.id) : "", code: org.code || "",
    logo: logoId(org.logo) || logoId(eng.logo),
    score: h["resultatEquipe"+n]
  };
}
function cleanName(x){
  if (!x) return "";
  x = String(x);
  if (x.includes("|")){
    // format FFBB "id|Nom|uuid|DIV|…" : on garde le premier morceau qui ressemble à un nom
    const parts = x.split("|").map(t => t.trim()).filter(Boolean);
    return parts.find(t => /[A-Za-zÀ-ÿ]{3,}/.test(t) && !/^[0-9a-f-]{20,}$/i.test(t)) || parts[0] || "";
  }
  return x;
}
function compName(comp, h){
  return cleanName(comp.nom) || cleanName(comp.nomExtended) || cleanName(h.nomExtended) || "Compétition";
}
function normalize(h){
  const s = h.salle || {}; const com = (s.commune && typeof s.commune === "object") ? s.commune : {};
  const carto = (s.cartographie && typeof s.cartographie === "object") ? s.cartographie : {};
  const cc = carto.coordonnees && carto.coordonnees.coordinates;
  const geo = h._geo || (carto.latitude ? {lat: +carto.latitude, lng: +carto.longitude} : (cc ? {lat: cc[1], lng: cc[0]} : null));
  const cat = catOf(h);
  const comp = h.competitionId || {};
  const t1 = team(h,1), t2 = team(h,2);
  const joue = !!h.joue || (t1.score!=null && t1.score!=="" && t2.score!=null && t2.score!=="" && +t1.score + +t2.score > 0);
  return {
    id: String(h.id || h.uniqueKey || Math.random()),
    date: parseDate(h), cat, sexe: sexeOf(h),
    comp: compName(comp, h),
    compCode: comp.code || "", compId: comp.id ? String(comp.id) : "", pouleId: (h.idPoule && h.idPoule.id) ? String(h.idPoule.id) : "", poule: (h.idPoule && h.idPoule.nom) || "", journee: h.numeroJournee,
    t1, t2, joue,
    salle: { nom: s.libelle || s.libelle2 || "", adresse: [s.adresse, s.adresseComplement].filter(Boolean).join(" "),
             cp: com.codePostal || carto.codePostal || "", ville: com.libelle || carto.ville || "", geo },
    officiels: h.officiels_string || ""
  };
}

function allKnown(){ const seen = {}, out = []; [S.matches, S.results || []].forEach(l => l.forEach(m => { if (!seen[m.id]){ seen[m.id] = 1; out.push(m); } })); return out; }
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function catSortKey(c){

function renderResults(list){
  const main = $("main");
  if (S.resLoading){ main.innerHTML = `<div class="load"><div class="spinner"></div>Récupération des résultats FFBB des ${S.resWeeks} derniers week-ends…</div>`; return; }
  if (S.resError){ main.innerHTML = `<div class="err">⚠️ ${esc(S.resError)}<br><button onclick="loadResults(true)">Réessayer</button></div>`; return; }
  if (!S.results){ loadResults(); return; }
  const more = `<button class="btn sec" onclick="moreResults()">Charger 4 week-ends de plus</button>`;
  if (!list.length){ main.innerHTML = `<div class="empty">Aucun résultat trouvé.${S.oldErr ? "<br>⚠️ " + esc(S.oldErr) : ""}</div>` + more; return; }
  list.sort((a,b) => (b.date - a.date) || catSortKey(a.cat) - catSortKey(b.cat));
  let html = "", lastW = "", lastDay = "";
  for (const m of list){
    const fri = weekendOf(m.date), wk = fmtShort(fri);
    if (wk !== lastW){ const sun = new Date(fri); sun.setDate(fri.getDate()+2); html += `<div class="group">Week-end du ${esc(fmtShort(fri))} au ${esc(fmtShort(sun))}</div>`; lastW = wk; lastDay = ""; }
    const day = fmtDay(m.date); if (day !== lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    html += matchCard(m);
  }
  html += `<div class="stat">${list.length} résultat${list.length>1?"s":""} · Données FFBB</div>`;
  if (S.oldErr) html += `<div class="stat">⚠️ Certains week-ends anciens n'ont pas pu être récupérés : ${esc(S.oldErr)}</div>`;
  html += more;
  main.innerHTML = html;
}
function weekendOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = x.getDay();
  const back = wd === 5 ? 0 : wd === 6 ? 1 : wd === 0 ? 2 : wd + 2; x.setDate(x.getDate() - back); return x;
}
async function loadResults(force){
  if (S.resLoading) return;

  S.resLoading = true; S.resError = null; if (S.tab === "res") renderMain();
  try{
    const now = new Date(); let all = [];
    for (let w = 0; w >= -S.resWeeks; w--){

/* Goal-average particulier entre deux équipes (matchs aller/retour entre elles).

function h2h(a, b, ms){
  const na = norm(a.nom), nb = norm(b.nom);
  const mutual = (ms || []).filter(m => { const x = norm(m.t1.nom), y = norm(m.t2.nom); return (x === na && y === nb) || (x === nb && y === na); });
  if (!mutual.length) return {diff: 0, decided: false, played: 0};
  let diff = 0, played = 0, winsA = 0, winsB = 0;
  mutual.forEach(m => {
    if (!m.joue) return;
    const s1 = parseInt(m.t1.score, 10), s2 = parseInt(m.t2.score, 10); if (isNaN(s1) || isNaN(s2)) return;
    played++;
    const d = norm(m.t1.nom) === na ? s1 - s2 : s2 - s1;
    diff += d; if (d > 0) winsA++; else if (d < 0) winsB++;

  // critère FFBB : d'abord les points des matchs particuliers (victoires), puis l'écart de paniers
  const score = winsA !== winsB ? (winsA - winsB) * 1000 + diff : diff;
  return {diff: score, decided: played === mutual.length && played > 0, played, gaDiff: diff};

/* a passe devant b à égalité de points ? true / false / null (pas encore décidé) */
function winsTie(a, b, ms){
  const h = h2h(a, b, ms);
  if (h.decided){ if (h.diff > 0) return true; if (h.diff < 0) return false; }
  return null;

function promoAnalysis(r, places){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (!rows.length) return null;
  const ms = r.matches || [];
  const known = !r.partial && ms.length > 0;
  rows.forEach(x => {
    let total = null;
    if (known){
      const n = ms.filter(m => norm(m.t1.nom) === norm(x.nom) || norm(m.t2.nom) === norm(x.nom)).length;
      total = n || null;
    }
    x.reste = total != null ? Math.max(0, total - x.joues) : null;
    x.max = x.reste != null ? x.points + 2 * x.reste : null;
  });
  const cut = rows[Math.min(places, rows.length) - 1];
  const outside = rows.slice(places);
  const bestOutsideMax = outside.length && outside.every(x => x.max != null) ? Math.max(...outside.map(x => x.max)) : (outside.length ? null : -1);
  const out = [];
  rows.forEach((x, i) => {
    let st = null, ga = "";
    if (i < places){
      // assuré si aucune équipe hors zone ne peut le dépasser, égalités départagées au goal-average particulier
      const safeFromAll = bestOutsideMax != null && outside.every(y => y.max < x.points || (y.max === x.points && winsTie(x, y, ms) === true));
      st = safeFromAll ? "q" : "z";
      if (safeFromAll && outside.some(y => y.max === x.points)) ga = "au goal-average particulier";
    }
    else if (x.max == null){ if (cut.points - x.points <= 4) st = "p"; }
    else if (x.max > cut.points) st = "p";
    else if (x.max === cut.points){
      const t = winsTie(x, cut, ms);
      if (t !== false){ st = "p"; ga = t === true ? "gagne le goal-average" : "goal-average à jouer"; }
    }
    if (st) out.push({...x, st, ga, ecart: Math.max(0, cut.points - x.points)});
  });
  return {out, known, finished: known && rows.every(x => x.reste === 0)};

function relegAnalysis(r, places){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (rows.length <= places) return null;
  promoAnalysis(r, 1); // calcule reste / max sur chaque ligne
  const n = rows.length, zoneStart = n - places;
  const safe = rows[zoneStart - 1];                  // dernière place sauvée
  const zone = rows.slice(zoneStart);
  const zoneBestMax = zone.every(x => x.max != null) ? Math.max(...zone.map(x => x.max)) : null;
  const out = [];
  rows.forEach((x, i) => {
    let st = null;
    const min = x.reste != null ? x.points + x.reste : null; // défaites = 1 pt
    let ga = "";
    if (i >= zoneStart){
      const condemned = x.max != null && (x.max < safe.points || (x.max === safe.points && winsTie(x, safe, r.matches) === false));
      st = condemned ? "c" : "d";
      if (condemned && x.max === safe.points) ga = "perd le goal-average";
    } else if (zoneBestMax != null && min != null){
      // menacé si une équipe de la zone peut le rattraper (à égalité : goal-average particulier)
      const threats = zone.filter(z => z.max > min || (z.max === min && winsTie(x, z, r.matches) !== true));
      if (threats.length) st = "m";
      else if (zone.some(z => z.max === min)) ga = "sauvé au goal-average";
    } else if (x.points - zone[0].points <= 4){
      st = "m";
    }
    if (st) out.push({...x, st, ga, marge: Math.max(0, x.points - zone[0].points), min});
  });
  return {out};
}
function stayAnalysis(r, upPlaces, downPlaces, lastDiv){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (!rows.length) return null;
  const pa = promoAnalysis(r, upPlaces);
  const ra = lastDiv ? {out: []} : (relegAnalysis(r, downPlaces) || {out: []});
  const upSet = new Set((pa ? pa.out : []).map(x => x.nom));
  const downSet = new Set(ra.out.map(x => x.nom));
  const n = rows.length;
  const out = [];
  rows.forEach((x, i) => {
    const inUpZone = i < upPlaces, inDownZone = !lastDiv && i >= n - downPlaces;
    if (inUpZone || inDownZone) return;                 // actuellement en zone de montée ou de descente
    const st = (!upSet.has(x.nom) && !downSet.has(x.nom)) ? "s" : "s2";
    out.push({...x, st, up: upSet.has(x.nom), down: downSet.has(x.nom)});
  });
  return {out};
}

    : mode === "up"

    : `<div class="stat"><span class="badge2 b-c">Condamné</span> ne peut plus se sauver · <span class="badge2 b-d">En position</span> dans la zone de descente · <span class="badge2 b-m">Menacé</span> peut encore y tomber</div>`;
  for (const c of tree){
    html += `<div class="day">${esc(prettyCat(c.cat))}</div>`;
    c.divs.forEach((d, di) => {
      const top = di === 0 && divRank(d.nom) <= 1;
      const last = c.divs.length > 1 && di === c.divs.length - 1;
      if (mode === "stay"){
        html += `<div class="div"><div class="hd">${esc(d.nom)}<span>${last ? "dernière division" : "reste dans la division"}</span></div>`;
        for (const [pk, p] of d.poules){
          const r = S.ranks[pk];
          html += `<div class="pl"><div class="ph2">${esc(p.nom)}</div>`;
          if (!r || r.loading){ html += `<div class="mini">Analyse en cours…</div></div>`; continue; }
          const a = stayAnalysis(r, upPl, downPl, last);
          if (!a){ html += `<div class="mini">${r.rankError ? "⚠️ " + esc(r.rankError) : "Classement pas encore disponible."}</div></div>`; continue; }
          if (!a.out.length){ html += `<div class="mini">Aucune équipe hors des zones de montée et de descente.</div></div>`; continue; }
          html += `<table class="rk"><tr><th>#</th><th style="text-align:left">Équipe</th><th>Pts</th><th>GA</th><th>Reste</th><th>Max</th></tr>` +
            a.out.map(x => `<tr><td>${esc(x.position)}</td><td class="tm">${logoHtml({logo: x.logo, club: x.club, nom: x.nom})}<span>${esc(x.nom)}
              <span class="badge2 ${x.st==="s"?"b-s":"b-s2"}">${x.st==="s" ? "Maintien assuré" : "Maintien probable" + (x.up && x.down ? " (↑↓ possible)" : x.up ? " (↑ possible)" : " (↓ possible)")}</span></span></td>
              <td class="pts">${esc(x.points)}</td><td>${x.diff>0?"+":""}${esc(x.diff)}</td><td>${x.reste != null ? esc(x.reste) : "?"}</td><td>${x.max != null ? esc(x.max) : "?"}</td></tr>`).join("") + `</table></div>`;
        }
        html += `</div>`;
        return;
      }
      if (mode === "down" && last){ html += `<div class="div"><div class="hd">${esc(d.nom)}<span>dernière division</span></div><div class="mini">Pas de descente depuis la division la plus basse.</div></div>`; return; }
      html += `<div class="div"><div class="hd">${esc(d.nom)}<span>${mode === "down" ? "vers la division inférieure" : top ? "montée en région" : "vers la division supérieure"}</span></div>`;
      for (const [pk, p] of d.poules){
        const r = S.ranks[pk];
        html += `<div class="pl"><div class="ph2">${esc(p.nom)}</div>`;
        if (!r || r.loading){ html += `<div class="mini">Analyse en cours…</div></div>`; continue; }
        const a = mode === "up" ? promoAnalysis(r, places) : relegAnalysis(r, places);
        if (a && mode === "down"){
          html += `<table class="rk"><tr><th>#</th><th style="text-align:left">Équipe</th><th>Pts</th><th>GA</th><th>Reste</th><th>Max</th></tr>` +
            a.out.map(x => `<tr><td>${esc(x.position)}</td><td class="tm">${logoHtml({logo: x.logo, club: x.club, nom: x.nom})}<span>${esc(x.nom)}
              <span class="badge2 ${x.st==="c"?"b-c":x.st==="d"?"b-d":"b-m"}">${x.st==="c"?"Condamné":x.st==="d"?"En position":"Menacé" + (x.marge ? " (+" + x.marge + " pts)" : "")}</span>${x.ga ? `<span class="badge2 b-p">${esc(x.ga)}</span>` : ""}</span></td>
              <td class="pts">${esc(x.points)}</td><td>${x.diff>0?"+":""}${esc(x.diff)}</td><td>${x.reste != null ? esc(x.reste) : "?"}</td><td>${x.max != null ? esc(x.max) : "?"}</td></tr>`).join("") + `</table></div>`;
          continue;
        }
        if (!a){ html += `<div class="mini">${r.rankError ? "⚠️ " + esc(r.rankError) : "Classement pas encore disponible."}</div></div>`; continue; }
        html += `<table class="rk"><tr><th>#</th><th style="text-align:left">Équipe</th><th>Pts</th><th>GA</th><th>Reste</th><th>Max</th></tr>` +
          a.out.map(x => `<tr><td>${esc(x.position)}</td><td class="tm">${logoHtml({logo: x.logo, club: x.club, nom: x.nom})}<span>${esc(x.nom)}
            <span class="badge2 ${x.st==="q"?"b-q":x.st==="z"?"b-z":"b-p"}">${x.st==="q"?"Assuré":x.st==="z"?"En position":"Encore possible" + (x.ecart ? " (−" + x.ecart + " pts)" : "")}</span>${x.ga ? `<span class="badge2 b-p">${esc(x.ga)}</span>` : ""}</span></td>
            <td class="pts">${esc(x.points)}</td><td>${x.diff>0?"+":""}${esc(x.diff)}</td><td>${x.reste != null ? esc(x.reste) : "?"}</td><td>${x.max != null ? esc(x.max) : "?"}</td></tr>`).join("") + `</table>`;
        if (!a.known) html += `<div class="mini">Calendrier complet indisponible : « Encore possible » = à 2 victoires ou moins.</div>`;
        else if (a.finished) html += `<div class="mini">Phase terminée.</div>`;
        html += `</div>`;
      }
      html += `</div>`;
    });
  }
  html += `<div class="stat">Calcul : victoire 2 pts, défaite 1 pt. À égalité de points : goal-average particulier (matchs entre les équipes à égalité), puis goal-average général (GA = paniers marqués − encaissés). Le nombre réel de ${mode==="down"?"descentes":"montées et descentes"} dépend du règlement du comité.</div>`;
  main.innerHTML = html;
}

/* ================= En direct ================= */
S.lives = null; S.liveErr = null; S.liveAll = false; S.liveAt = 0;
let liveTimer = null;
function startLive(){
  stopLive();
  refreshLive();
  liveTimer = setInterval(refreshLive, 30000);   // flux direct toutes les 30 s
}
function stopLive(){ if (liveTimer){ clearInterval(liveTimer); liveTimer = null; } }
let liveTick = 0;
async function refreshLive(){
  if (S.tab !== "live"){ stopLive(); return; }
  try{
    const r = await http("GET", API + "json/lives.json", {});
    if (r.status < 200 || r.status >= 300) throw Object.assign(new Error("HTTP " + r.status), {status: r.status});
    const j = JSON.parse(r.text || "[]");
    S.lives = Array.isArray(j) ? j : (j.data || []);
    S.liveErr = null;
  }catch(e){ S.liveErr = e.status === 403 ? "Le flux direct FFBB refuse la connexion (HTTP 403)." : (e.message || String(e)); }
  // toutes les 2 minutes : on recharge aussi les matchs du week-end pour récupérer les scores dès leur saisie
  if (S.offset === 0 && (liveTick++ % 4 === 0)){
    try{ const ms = await loadMatches(weekendRange(0)); cache["w0"] = ms; S.matches = ms; }catch(e){}
  }
  S.liveAt = Date.now();
  if (S.tab === "live") renderMain();
}
function liveClock(l){
  const per = l.currentPeriod ? String(l.currentPeriod).replace(/^Q/i, "QT") : "";
  const st = String(l.matchStatus || l.currentStatus || "").toLowerCase();
  if (/fin|final|end|termin/.test(st)) return "Terminé";
  if (/mi-temps|half/.test(st)) return "Mi-temps";
  return [per, l.clock].filter(Boolean).join(" · ") || "En cours";
}
function liveIsEssonne(l){
  const id = String(l.matchId || "");
  if (id && S.matches.some(m => m.id === id)) return true;
  const h = norm(l.teamName_home), o = norm(l.teamName_out);
  return S.matches.some(m => (norm(m.t1.nom) === h && norm(m.t2.nom) === o) || (norm(m.t1.club) && h.includes(norm(m.t1.club)) && o.includes(norm(m.t2.club))));
}
function liveCard(l){
  const m = S.matches.find(x => x.id === String(l.matchId)) || null;
  const t1 = m ? m.t1 : {nom: l.teamName_home, logo: logoId((l.teamEngagement_home||{}).logo)};
  const t2 = m ? m.t2 : {nom: l.teamName_out, logo: logoId((l.teamEngagement_out||{}).logo)};
  const qs = [1,2,3,4].map(i => [l["score_q"+i+"_home"], l["score_q"+i+"_out"]]).filter(x => x[0] != null || x[1] != null);
  const sh = +l.score_home || 0, so = +l.score_out || 0;
  return `<div class="match"${m ? ` data-id="${esc(m.id)}"` : ""}>
    <div class="top"><span class="cat" style="background:#6E1E2C;color:#FFC9D2">● DIRECT</span><span class="comp">${esc(cleanName(l.competitionName || l.competitionAbgName || (m && m.comp) || ""))}</span></div>
    <div class="teams">
      <div class="team ${sh>so?"win":""}">${logoHtml(t1)}<div class="nm">${esc(t1.nom)}</div></div>
      <div class="mid"><div class="sc">${sh} - ${so}</div><div class="st">${esc(liveClock(l))}</div></div>
      <div class="team ${so>sh?"win":""}">${logoHtml(t2)}<div class="nm">${esc(t2.nom)}</div></div>
    </div>
    ${qs.length ? `<div class="gym" style="justify-content:center;gap:10px">${qs.map((q,i) => `<span>QT${i+1} <b>${q[0] ?? "-"}-${q[1] ?? "-"}</b></span>`).join("")}</div>` : ""}
    ${m && m.salle.nom ? `<div class="gym">📍 <span><b>${esc(m.salle.nom)}</b>${m.salle.ville ? " · " + esc(m.salle.ville) : ""}</span></div>` : ""}
  </div>`;
}
function renderLive(){
  const main = $("main");
  const now = Date.now();
  const all = S.lives || [];
  const ess = all.filter(liveIsEssonne);
  const shown = S.liveAll ? all : ess;
  const words = norm(S.q).split(/\s+/).filter(Boolean);
  const shownF = shown.filter(l => !words.length || words.every(w => norm([l.teamName_home, l.teamName_out, l.competitionName].join(" ")).includes(w)));
  // matchs de l'Essonne commencés selon l'horaire (sans live FFBB)
  const liveIds = new Set(all.map(l => String(l.matchId)));
  const enCours = filtered().filter(m => m.date && !m.joue && !liveIds.has(m.id) && m.date.getTime() <= now && now - m.date.getTime() < 2.25*3600e3 && !(m.date.getHours() === 0 && m.date.getMinutes() === 0));
  const finis = filtered().filter(m => m.joue && m.date && now - m.date.getTime() < 4*3600e3).sort((a,b) => b.date - a.date);
  let html = `<div class="chips"><button class="chip ${!S.liveAll?"on":""}" data-liveall="0">Essonne (${ess.length})</button><button class="chip ${S.liveAll?"on":""}" data-liveall="1">Toute la France (${all.length})</button></div>`;
  html += `<div class="stat">${S.liveAt ? "Mis à jour à " + new Date(S.liveAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " · actualisation auto toutes les 30 s" : "Chargement du direct…"}</div>`;
  if (S.liveErr) html += `<div class="stat">⚠️ ${esc(S.liveErr)}</div>`;
  if (shownF.length){
    html += `<div class="day">● Scores en direct</div>` + shownF.map(liveCard).join("");
  } else if (S.lives){
    html += `<div class="empty" style="padding:20px">Aucun score en direct ${S.liveAll ? "en France" : "en Essonne"} pour le moment.<br><span class="stat">Le direct n'existe que pour les matchs suivis en e-Marque V2 avec statistiques live.</span></div>`;
  }
  if (enCours.length){
    html += `<div class="day">⏱ En cours (d'après l'horaire)</div><div class="stat">Score publié par la FFBB à la fin du match.</div>` + enCours.sort((a,b) => a.date - b.date).map(matchCard).join("");
  }
  if (finis.length){
    html += `<div class="day">✔ Terminés récemment</div>` + finis.map(matchCard).join("");
  }
  if (!shownF.length && !enCours.length && !finis.length && S.lives){
    const next = filtered().filter(m => m.date && m.date.getTime() > now).sort((a,b) => a.date - b.date)[0];
    if (next) html += `<div class="stat">Prochain match : ${esc(fmtDay(next.date))} à ${esc(next.date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}))}</div>` + matchCard(next);
  }
  main.innerHTML = html;
}

S.notif = store.get("notif", {enabled: false, rappel: true, rappelMin: 60, resultats: true, asked: false});

function showNotifSheet(msg){
  const n = S.notif;
  const opts = [15, 30, 60, 120, 180].map(v => `<option value="${v}" ${n.rappelMin===v?"selected":""}>${v < 60 ? v + " min" : (v/60) + " h"} avant</option>`).join("");
  openSheet(`<div class="settings"><h2>🔔 Notifications</h2>

    <label><input type="checkbox" id="nRappel" ${n.rappel?"checked":""} style="width:auto"> Rappel avant le match</label>
    <select id="nMin" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)">${opts}</select>
    <label><input type="checkbox" id="nRes" ${n.resultats?"checked":""} style="width:auto"> Score final publié</label>
    ${n.enabled ? `<button class="btn" data-notif="save">Enregistrer</button><button class="btn sec" data-notif="test">Envoyer une notification de test</button><button class="btn sec" data-notif="off">Désactiver</button>`
                : `<button class="btn" data-notif="on">Activer les notifications</button>`}
    <button class="btn sec" onclick="closeSheet()">Fermer</button>
    <p class="stat">Vérification automatique toutes les 15 min environ, même appli fermée.</p></div>`);
}
function handleNotifClick(act){
  const read = () => { const r = $("nRappel"), m = $("nMin"), res = $("nRes"); if (r){ S.notif.rappel = r.checked; S.notif.rappelMin = +m.value; S.notif.resultats = res.checked; } };
  if (act === "on"){ read(); S.notif.asked = true; store.set("notif", S.notif); enableNotif(); }
  else if (act === "later"){ S.notif.asked = true; store.set("notif", S.notif); closeSheet(); }
  else if (act === "save"){ read(); saveNotif(); showNotifSheet("✅ Enregistré."); }
  else if (act === "test"){ try{ AndroidBridge.testNotif(); }catch(e){} }
  else if (act === "off"){ S.notif.enabled = false; saveNotif(); showNotifSheet("Notifications désactivées."); }
}

/* ================= NBA (flux public ESPN) ================= */
S.nbaDay = null; S.nba = null; S.nbaErr = null; S.nbaLoading = false; S.nbaAt = 0;
let nbaTimer = null;
function nbaDefaultDay(){
  // matchs NBA = soirée américaine = nuit en France : on décale de 10 h pour tomber sur « la nuit dernière »
  const d = new Date(Date.now() - 10*3600e3); d.setHours(12,0,0,0); return d;
}
function nbaKey(d){ const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
async function loadNba(silent){
  if (!S.nbaDay) S.nbaDay = nbaDefaultDay();
  if (!silent){ S.nbaLoading = true; S.nbaErr = null; renderMain(); }
  try{
    const j = await httpJson("GET", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + nbaKey(S.nbaDay), {});
    S.nba = (j.events || []).map(nbaNorm).sort((a,b) => a.date - b.date);
    S.nbaErr = null; S.nbaAt = Date.now();
  }catch(e){ S.nbaErr = e.message || String(e); if (!silent) S.nba = []; }
  S.nbaLoading = false;
  if (S.tab === "nba") renderMain();
  // actualisation auto toutes les 30 s s'il y a des matchs en cours
  clearTimeout(nbaTimer);
  if (S.tab === "nba" && (S.nba || []).some(g => g.state === "in")) nbaTimer = setTimeout(() => loadNba(true), 30000);
}
function nbaNorm(ev){
  const c = (ev.competitions && ev.competitions[0]) || {};
  const st = (ev.status && ev.status.type) || {};
  const team = cp => {
    const t = cp.team || {};
    const rec = (cp.records || []).find(r => r.type === "total" || r.name === "overall");
    return { nom: t.displayName || t.name || "?", abbr: t.abbreviation || "", logo: t.logo || "", score: cp.score,
             winner: cp.winner === true, record: rec ? rec.summary : "", ls: (cp.linescores || []).map(l => l.value != null ? l.value : l.displayValue) };
  };
  const comps = c.competitors || [];
  const home = comps.find(x => x.homeAway === "home") || comps[1] || {}, away = comps.find(x => x.homeAway === "away") || comps[0] || {};
  return { id: ev.id, date: new Date(ev.date), state: st.state || "pre", completed: !!st.completed, detail: st.shortDetail || st.detail || "",
           clock: ev.status && ev.status.displayClock, period: ev.status && ev.status.period,
           away: team(away), home: team(home), venue: c.venue ? [c.venue.fullName, c.venue.address && c.venue.address.city].filter(Boolean).join(" · ") : "",
           tv: (c.broadcasts || []).flatMap(b => b.names || []).join(", ") };
}
function nbaLogo(t){
  return t.logo ? `<img class="logo" loading="lazy" alt="" src="${esc(t.logo)}" onerror="this.outerHTML='<div class=&quot;logo ph&quot;>${esc(t.abbr)}</div>'">`
                : `<div class="logo ph">${esc(t.abbr || "?")}</div>`;
}
function nbaCard(g){
  const hr = g.date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  const done = g.state === "post", live = g.state === "in";
  const a = +g.away.score || 0, h = +g.home.score || 0;
  const mid = done ? `<div class="sc">${a} - ${h}</div><div class="st">Terminé${/OT/.test(g.detail) ? " (" + esc(g.detail.replace(/^Final\/?/,"")) + ")" : ""}</div>`
            : live ? `<div class="sc" style="color:#FF6B7F">${a} - ${h}</div><div class="st">● QT${esc(g.period)} · ${esc(g.clock || "")}</div>`
            : `<div class="hr">${hr}</div><div class="st">${esc(g.date.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))}</div>`;
  const qs = Math.max(g.away.ls.length, g.home.ls.length);
  const lines = (done || live) && qs ? `<div class="gym" style="justify-content:center;gap:10px;flex-wrap:wrap">${Array.from({length: qs}, (_, i) => `<span>${i < 4 ? "QT" + (i+1) : "Prol." + (i-3)} <b>${esc(g.away.ls[i] ?? "-")}-${esc(g.home.ls[i] ?? "-")}</b></span>`).join("")}</div>` : "";
  return `<div class="match">
    <div class="top"><span class="cat" style="background:#1D428A;color:#fff">NBA</span><span class="comp">${esc(g.away.abbr)} @ ${esc(g.home.abbr)}${g.tv ? " · " + esc(g.tv) : ""}</span></div>
    <div class="teams">
      <div class="team ${done && a>h ? "win":""}">${nbaLogo(g.away)}<div class="nm">${esc(g.away.nom)}</div>${nbaStar(g.away)}<div class="st" style="font-size:11px;color:var(--mute)">${esc(g.away.record)}</div></div>
      <div class="mid">${mid}</div>
      <div class="team ${done && h>a ? "win":""}">${nbaLogo(g.home)}<div class="nm">${esc(g.home.nom)}</div>${nbaStar(g.home)}<div class="st" style="font-size:11px;color:var(--mute)">${esc(g.home.record)}</div></div>
    </div>
    ${lines}
    ${g.venue ? `<div class="gym">🏟 <span>${esc(g.venue)}</span></div>` : ""}
  </div>`;
}
function nbaFav(t){ return S.favs.some(f => f.key === "nba:" + t.abbr); }
function nbaStar(t){ const on = nbaFav(t); return `<button class="star mini ${on?"on":""}" data-fav="nba:${esc(t.abbr)}" data-favname="${esc(t.nom)}">${on?"★":"☆"}</button>`; }
function renderNba(){
  const main = $("main");
  if (!S.nbaDay) S.nbaDay = nbaDefaultDay();
  const isDefault = nbaKey(S.nbaDay) === nbaKey(nbaDefaultDay());
  let html = `<div class="week" style="margin:4px 0 8px"><button data-nbaday="-1" aria-label="Jour précédent">‹</button>
    <div class="lbl"><b>${isDefault ? "La nuit dernière" : esc(S.nbaDay.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))}</b>

S.liveMap = {}; S.liveStatus = "";  // "" inconnu, "ok", "blocked", "err"
function liveKey(a, b){ return norm(a) + "|" + norm(b); }
async function refreshLiveMap(){
  try{
    const r = await http("GET", API + "json/lives.json", {});
    if (r.status === 403){ S.liveStatus = "blocked"; return; }
    if (r.status < 200 || r.status >= 300){ S.liveStatus = "err"; return; }
    const j = JSON.parse(r.text || "[]"); const arr = Array.isArray(j) ? j : (j.data || []);
    const map = {};
    arr.forEach(l => { if (l.matchId != null) map["id:" + l.matchId] = l; map[liveKey(l.teamName_home, l.teamName_out)] = l; });
    S.liveMap = map; S.liveStatus = "ok";
  }catch(e){ S.liveStatus = "err"; }
}
function liveOf(m){ return S.liveMap["id:" + m.id] || S.liveMap[liveKey(m.t1.nom, m.t2.nom)] || null; }
function liveLabel(l){
  const st = String(l.matchStatus || l.currentStatus || "").toLowerCase();
  if (/fin|final|end|termin/.test(st)) return "Fin du match";
  if (/half|mi-temps/.test(st)) return "Mi-temps";
  const per = l.currentPeriod ? String(l.currentPeriod).replace(/^Q/i, "QT") : "";
  return [per, l.clock].filter(Boolean).join(" · ") || "En direct";
}

S.homeAll = false; S.nbaHome = [];
function isLiveMatch(m, now){
  if (m.joue || !m.date) return false;
  if (m.date.getHours() === 0 && m.date.getMinutes() === 0) return false;
  const t = m.date.getTime();
  return t <= now && now - t < 2.25*3600e3;
}
function homeToggle(nAll){
  const now = Date.now();
  const nLive = filtered().filter(m => isLiveMatch(m, now)).length + S.nbaHome.filter(g => g.state === "in").length;

}
async function refreshNbaHome(){
  try{
    const j = await httpJson("GET", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + nbaKey(nbaDefaultDay()), {});
    S.nbaHome = (j.events || []).map(nbaNorm);

function renderHome(list){
  const now = Date.now();
  const live = list.filter(m => isLiveMatch(m, now)).sort((a,b) => a.date - b.date);
  const nbaLive = S.nbaHome.filter(g => g.state === "in");
  let html = homeToggle(list.length);
  if (live.length){
    const withScore = live.filter(m => liveOf(m)).length;
    html += `<div class="day">● En cours en Essonne (${live.length})</div>` + live.map(matchCard).join("");
    html += `<div class="stat">${S.liveStatus === "ok" ? (withScore ? `Score en direct pour ${withScore} match${withScore>1?"s":""} (actualisé toutes les 30 s). ` : "") + (withScore < live.length ? "Les autres matchs n'ont pas de direct FFBB (pas d'e-Marque V2 en live) : score à la fin du match." : "")
      : S.liveStatus === "blocked" ? "⚠️ Le flux direct FFBB refuse la connexion : score à la fin du match." : "Recherche des scores en direct…"}</div>`;
  }
  if (nbaLive.length) html += `<div class="day">● En cours en NBA (${nbaLive.length})</div>` + nbaLive.map(nbaCard).join("");
  if (!live.length && !nbaLive.length){
    const next = list.filter(m => m.date && !m.joue && m.date.getTime() > now).sort((a,b) => a.date - b.date);
    html += `<div class="empty" style="padding:26px 16px">Aucun match en cours pour le moment.</div>`;
    if (next.length){

      html += `<div class="day">Prochains coups d'envoi · ${esc(fmtDay(next[0].date))} à ${esc(next[0].date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}))}</div>` + batch.slice(0, 6).map(matchCard).join("");

    }
  }

  $("main").innerHTML = html;
}

document.addEventListener("click", e => {

  const nd = e.target.closest("[data-nbaday]");
  if (nd){ const k = +nd.dataset.nbaday; if (k){ const d = new Date(S.nbaDay || nbaDefaultDay()); d.setDate(d.getDate() + k); S.nbaDay = d; } loadNba(); return; }
  const nb = e.target.closest("[data-notif]");
  if (nb){ handleNotifClick(nb.dataset.notif); return; }
  const la = e.target.closest("[data-liveall]");
  if (la){ S.liveAll = la.dataset.liveall === "1"; renderMain(); return; }
  const um = e.target.closest("[data-upmode]");
  if (um){ S.upMode = um.dataset.upmode; renderMain(); return; }
  const pv = e.target.closest("[data-pview],[data-pj]");
  if (pv){
    const r = S.ranks[pv.dataset.pk]; if (!r) return;
    if (pv.dataset.pview) r.view = pv.dataset.pview; else r.j = +pv.dataset.pj;
    renderMain(); return;
  }
  const pl = e.target.closest("[data-poule],[data-poule-retry]");
  if (pl){
    const pk = pl.dataset.poule || pl.dataset.pouleRetry; const p = pouleFromKey(pk);
    if (pl.dataset.pouleRetry){ loadRanking(pk, p.id, p); return; }
    S.open[pk] = !S.open[pk];
    if (S.open[pk] && (!S.ranks[pk] || S.ranks[pk].error)) loadRanking(pk, p.id, p); else renderMain();
    return;
  }
  const el = e.target.closest("[data-cat],[data-sexe],[data-tab],[data-go],[data-fav],[data-club],[data-clearclub],.match,#saveSet,#resetSet");
  if (e.target.id === "sheet"){ closeSheet(); return; }
  if (!el) return;
  if (el.id === "saveSet"){ store.set("placesMontee", Math.max(1, +$("setPlaces").value || 1)); store.set("placesDescente", Math.max(1, +$("setDown").value || 1)); const nom = $("setNom").value.trim(), id = $("setId").value.trim(); store.set("comite", (nom||id) ? {nom: nom||undefined, id: id||undefined, manual: true} : null); closeSheet(); reload(); return; }
  if (el.id === "resetSet"){ store.set("comite", null); closeSheet(); reload(true); return; }
  if (el.dataset.cat){ S.cat = el.dataset.cat; render(); return; }
  if (el.dataset.sexe){ S.sexe = el.dataset.sexe; render(); return; }
  if (el.dataset.clearclub){ S.club = null; render(); return; }
  if (el.dataset.tab){ const wasRes = S.tab === "res"; S.tab = el.dataset.tab; if (wasRes !== (S.tab === "res")) S.cat = "ALL"; if ((S.tab === "cls" || S.tab === "up") && !S.results) loadResults(); if (S.tab === "live") startLive(); else stopLive(); if (S.tab === "nba") loadNba(); document.body.classList.toggle("nba", S.tab === "nba"); document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t===el)); renderChips(); renderMain(); return; }
  if (el.dataset.go){ e.stopPropagation(); const m = findMatch(el.dataset.go); if (m) openUrl(mapsUrl(m)); return; }
  if (el.dataset.fav){
    e.stopPropagation(); const k = el.dataset.fav;
    const i = S.favs.findIndex(f => f.key === k);
    if (i >= 0) S.favs.splice(i,1); else S.favs.push({key:k, nom: el.dataset.favname});
    store.set("favs", S.favs); const on = i < 0;
    document.querySelectorAll(`[data-fav="${CSS.escape(k)}"]`).forEach(b => { b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; });
    if (k.startsWith("nba:") && S.tab === "nba") renderNba();
    syncNotif(); if (on && !k.startsWith("nba:")) setTimeout(() => proposeNotif(el.dataset.favname), 400);
    if (S.tab === "favs") renderMain(); return;
  }
  if (el.dataset.club !== undefined){ if (el.dataset.club){ S.club = el.dataset.club; S.tab = "matchs"; document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab==="matchs")); render(); window.scrollTo(0,0); } return; }
  if (el.classList.contains("match")){ showMatch(el.dataset.id); }
});

  if (refreshing) return; refreshing = true;
  $("btnRefresh").classList.add("spin"); $("ptr").classList.add("spin");
  const before = new Set(allKnown().filter(m => m.joue).map(m => m.id));
  try{
    Object.keys(cache).forEach(k => delete cache[k]);       // on oublie tout ce qui était en mémoire
    try{ localStorage.removeItem("tokens"); }catch(e){}
    if (S.tab === "nba"){ await loadNba(true); }
    else {
      const ms = await loadMatches(weekendRange(S.offset));
      cache["w" + S.offset] = ms; S.matches = ms; S.error = null;
      if (S.results || S.tab === "res"){ S.results = null; await loadResults(true); }
      if (S.tab === "cls" || S.tab === "up" || S.tab === "favs"){ S.ranks = {}; }
      if (S.matches.some(m => isLiveMatch(m, Date.now()))) await refreshLiveMap();
      refreshNbaHome();
    }
    const fresh = allKnown().filter(m => m.joue && !before.has(m.id)).length;
    render();
    const hr = new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    toast(S.tab === "nba" ? `NBA à jour (${hr})` : fresh ? `✅ ${fresh} nouveau${fresh>1?"x":""} résultat${fresh>1?"s":""} · ${hr}` : `À jour · ${hr}`);
  }catch(e){ toast("⚠️ Impossible d'actualiser : " + (e.message || e)); }
  finally{ refreshing = false; $("btnRefresh").classList.remove("spin"); $("ptr").classList.remove("spin"); $("ptr").style.transform = ""; }
}
window.refreshAll = refreshAll;
(function(){
  let y0 = null, pulled = 0;
  document.addEventListener("touchstart", e => { if (window.scrollY <= 0 && !$("sheet").classList.contains("on") && (!$("splash") || $("splash").classList.contains("gone"))) y0 = e.touches[0].clientY; else y0 = null; }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (y0 == null || refreshing) return;
    pulled = Math.max(0, e.touches[0].clientY - y0);
    if (pulled > 5 && window.scrollY <= 0) $("ptr").style.transform = `translate(-50%, ${Math.min(pulled * 0.6, 90) - 50}px) rotate(${pulled * 2}deg)`;
  }, {passive: true});
  document.addEventListener("touchend", () => {
    if (y0 == null) return;
    if (pulled > 90 && !refreshing){ $("ptr").style.transform = "translate(-50%, 30px)"; refreshAll(); }
    else if (!refreshing) $("ptr").style.transform = "";
    y0 = null; pulled = 0;
  });
})();
async function reload(force){
  const key = "w" + S.offset;
  renderWeek();
  if (!force && cache[key]){ S.matches = cache[key]; S.error = null; S.cat = "ALL"; render(); return; }
  S.loading = true; S.error = null; S.cat = "ALL"; S.club = null; renderChips(); renderMain();
  const myOffset = S.offset;
  try{
    const ms = await loadMatches(weekendRange(S.offset));
    if (myOffset !== S.offset) return;
    cache[key] = ms; S.matches = ms; syncNotif();
    store.set("last_" + key, {t: Date.now(), n: ms.length});
  }catch(err){
    if (myOffset !== S.offset) return;
    S.error = (err && err.message) || String(err); S.matches = [];
  }finally{
    if (myOffset === S.offset){ S.loading = false; render(); }
  }
}
window.reload = reload; window.closeSheet = closeSheet;
reload();
</script>

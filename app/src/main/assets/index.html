<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>91 : Basket Essonne</title>
<style>
:root{
  --bg:#0F1B2D; --card:#17263D; --card2:#1E3150; --line:#2A3F62;
  --txt:#EEF2F8; --mute:#9DB0CC; --orange:#F26B1D; --orange2:#FF8C42;
  --win:#3CCB7F; --lose:#E5576B; --radius:14px;
  --txt2:#C9D6EA; --err:#FFB4BE; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 14px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .badge{width:38px;height:38px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 0 0 3px rgba(242,107,29,.25)}
.brand > div:nth-child(2){margin-right:auto}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.brand .refresh{padding:8px 8px !important;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:16px}
.week{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.week button{background:none;border:none;color:var(--orange2);font-size:22px;padding:6px 14px}
.week .lbl{text-align:center}
.week .lbl b{display:block;font-size:15px}
.week .lbl span{font-size:12px;color:var(--mute)}
.search{margin-top:8px;position:relative}
.search input{width:100%;padding:11px 12px 11px 36px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;outline:none}
.search input:focus{border-color:var(--orange)}
.search:before{content:"🔍";position:absolute;left:11px;top:10px;font-size:14px;opacity:.7}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:13px;font-weight:600}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tabs{display:flex;gap:4px;margin-top:6px}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:8px 10px;text-align:center;border-radius:10px;color:var(--mute);font-weight:700;font-size:13px;background:transparent;border:none}
.tab.on{background:var(--card2);color:var(--txt)}
main{padding:6px 12px 90px}
.day{margin:16px 2px 6px;font-weight:800;color:var(--orange2);text-transform:capitalize;font-size:14px}
.group{margin:12px 2px 4px;color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.match{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:8px 0}
.match .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.match .comp{font-weight:700;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{background:var(--card2);border-radius:6px;padding:2px 7px;font-weight:800;color:var(--orange2);font-size:11px;flex:0 0 auto}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0 8px}
.team{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.team .nm{font-size:13px;font-weight:700;line-height:1.2;word-break:break-word}
.team.win .nm{color:var(--win)}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;flex:0 0 auto}
.logo.ph{display:grid;place-items:center;background:var(--card2);color:var(--txt);font-weight:800;font-size:14px;padding:0;border:1px solid var(--line)}
.mid{text-align:center;min-width:64px}
.mid .hr{font-size:18px;font-weight:800}
.mid .sc{font-size:20px;font-weight:900;letter-spacing:1px}
.mid .st{font-size:11px;color:var(--mute)}
.gym{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:7px}
.gym b{color:var(--txt2);font-weight:600}
.gym .go{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--orange2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700}
.star{background:none;border:none;font-size:18px;color:var(--mute);padding:0 2px}
.star.on{color:#FFC83D}
.star.mini{font-size:20px;line-height:1;padding:2px 10px;margin-top:-2px}
.favrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.favrow .nm{flex:1;font-weight:700;font-size:14px}.favrow .ty{font-size:11px;color:var(--mute)}
.favrow .x{background:none;border:none;color:var(--mute);font-size:18px;padding:4px 8px}
.empty,.err,.load{text-align:center;color:var(--mute);padding:40px 16px;line-height:1.5}
.err{color:var(--err)}
.err button,.empty button{margin-top:12px;background:var(--orange);border:none;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.club{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:8px 0}
.club .info{flex:1;min-width:0}
.club .info b{display:block;font-size:14px}
.club .info span{font-size:12px;color:var(--mute)}
.count{background:var(--card2);border-radius:999px;padding:4px 10px;font-weight:800;color:var(--orange2);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet .box{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:16px 16px 28px}
.sheet h2{font-size:16px;margin:4px 0 12px}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv .k{color:var(--mute);min-width:96px}
.btn{display:block;width:100%;margin-top:12px;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:15px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.stat{font-size:12px;color:var(--mute);margin:8px 2px 0}
.div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;overflow:hidden}
.div > .hd{padding:11px 12px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.div > .hd span{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
.pl{border-top:1px solid var(--line)}
.pl .ph2{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--txt2)}
.pl .ph2 i{font-style:normal;color:var(--orange2)}
table.rk{width:100%;border-collapse:collapse;font-size:12.5px}
table.rk th{color:var(--mute);font-weight:700;text-align:center;padding:6px 3px;background:var(--card2)}
table.rk td{text-align:center;padding:7px 3px;border-top:1px solid var(--line)}
table.rk td.tm{text-align:left;display:flex;align-items:center;gap:7px;font-weight:600}
table.rk td.tm .logo{width:24px;height:24px;font-size:9px;padding:1px}
table.rk td.pts{font-weight:900;color:var(--orange2)}
table.rk tr.me td{background:rgba(242,107,29,.12)}
.mini{font-size:11px;color:var(--mute);padding:6px 12px 10px}
.badge2{display:inline-block;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:800;margin-left:4px;white-space:nowrap}
.b-q{background:#1E6B45;color:#BFF5D7}.b-c{background:#6E1E2C;color:#FFC9D2}.b-d{background:#7A3E12;color:#FFD9BD}.b-m{background:#4A3A12;color:#FFE7A8}.b-s{background:#1F4E6B;color:#CDEBFF}.b-s2{background:#2A3F62;color:#C9D6EA}.b-z{background:#7A3E12;color:#FFD9BD}.b-p{background:#2A3F62;color:#C9D6EA}
.prog{height:4px;background:var(--line);border-radius:4px;margin:0 12px 8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--orange)}
body.nba header > .week, body.nba #cats, body.nba #sexes{display:none}
.ffbblink{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 4px;padding:11px 12px;border-radius:12px;border:1px solid #2E5AA8;background:linear-gradient(90deg,#1B3A75,#17263D);color:#EEF2F8;font-weight:800;font-size:14px;text-align:left}
.ffbblink small{display:block;font-weight:500;color:#AFC3E6;font-size:12px}.ffbblink i{margin-left:auto;font-style:normal;color:#9DC0FF}
.settings label{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}
.settings input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
#splash{position:fixed;inset:0;z-index:100;background:#0F1B2D;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spOut .45s ease-in 2.9s forwards}
#splash.gone{display:none}
.sp-svg{width:min(92vw,420px);height:auto;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sp-player{animation:spPlayer 2.2s cubic-bezier(.45,.05,.55,.95) forwards}
.sp-body{transform-origin:0 -40px;animation:spBody 2.2s ease-in-out forwards}
.sp-ball{animation:spBall 2.2s cubic-bezier(.45,.05,.55,.95) forwards}
.sp-shadow{animation:spShadow 2.2s cubic-bezier(.45,.05,.55,.95) forwards}
.sp-rim{transform-origin:298px 150px;animation:spRim 2.2s ease-out forwards}
.sp-net{transform-origin:275px 150px;animation:spNet 2.2s ease-out forwards}
.sp-dunk{opacity:0;transform-origin:190px 100px;animation:spDunk 2.2s ease-out forwards}
.sp-title{display:flex;align-items:center;gap:12px;margin-top:22px;opacity:0;transform:translateY(12px);animation:spTitle .5s ease-out 1.7s forwards;color:#EEF2F8}
.sp-title b{display:block;font-size:24px;font-weight:900}.sp-title span{color:#9DB0CC;font-size:13px}
.sp-badge{width:52px;height:52px;border-radius:50%;background:#F26B1D;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 0 0 5px rgba(242,107,29,.25)}
@keyframes spPlayer{
  0%{transform:translate(-60px,330px)} 22%{transform:translate(110px,330px)} 28%{transform:translate(130px,334px)}
  50%{transform:translate(236px,238px)} 56%{transform:translate(242px,246px)} 70%{transform:translate(244px,252px)}
  86%{transform:translate(250px,330px)} 90%{transform:translate(250px,333px)} 100%{transform:translate(250px,330px)}}
@keyframes spBody{0%,20%{transform:rotate(8deg)} 28%{transform:scaleY(.88) rotate(10deg)} 40%{transform:rotate(-6deg)} 56%{transform:rotate(-12deg)} 80%{transform:rotate(0)} 100%{transform:rotate(0)}}
@keyframes spBall{
  0%{transform:translate(-30px,230px)} 6%{transform:translate(-8px,300px)} 12%{transform:translate(20px,232px)} 18%{transform:translate(48px,300px)} 22%{transform:translate(140px,230px)}
  28%{transform:translate(160px,236px)} 50%{transform:translate(266px,138px)} 54%{transform:translate(274px,146px)}
  60%{transform:translate(275px,182px)} 64%{transform:translate(275px,205px)} 76%{transform:translate(272px,320px)} 84%{transform:translate(285px,286px)} 92%{transform:translate(296px,320px)} 100%{transform:translate(304px,320px)}}
@keyframes spShadow{0%{transform:translateX(-60px)} 22%{transform:translateX(110px)} 50%{transform:translateX(236px) scale(.6);opacity:.12} 70%{transform:translateX(244px) scale(.6);opacity:.12} 86%,100%{transform:translateX(250px);opacity:.3}}
@keyframes spRim{0%,53%{transform:rotate(0)} 57%{transform:rotate(-9deg)} 66%{transform:rotate(4deg)} 74%{transform:rotate(-2deg)} 82%,100%{transform:rotate(0)}}
@keyframes spNet{0%,55%{transform:scaleY(1)} 62%{transform:scaleY(1.35) scaleX(.9)} 72%{transform:scaleY(.92)} 82%,100%{transform:scaleY(1)}}
@keyframes spDunk{0%,54%{opacity:0;transform:scale(.3) rotate(-8deg)} 60%{opacity:1;transform:scale(1.15) rotate(-6deg)} 66%{transform:scale(1) rotate(-6deg)} 90%{opacity:1} 100%{opacity:0;transform:scale(1.05) rotate(-6deg)}}
@keyframes spTitle{to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash{animation-delay:.6s}.sp-player,.sp-body,.sp-ball,.sp-shadow,.sp-rim,.sp-net,.sp-dunk{animation-duration:.01s}}
#ptr{position:fixed;left:50%;top:0;z-index:60;transform:translate(-50%,-60px);width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--orange2);font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s}
#ptr.spin span{animation:sp .8s linear infinite;display:inline-block}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
/* ===== Adaptation à l'appareil (taille d'écran, orientation, encoches) ===== */
header{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px),calc((100vw - 1180px)/2));padding-right:max(14px,env(safe-area-inset-right,0px),calc((100vw - 1180px)/2))}
main{padding-left:max(12px,env(safe-area-inset-left,0px),calc((100vw - 1180px)/2));padding-right:max(12px,env(safe-area-inset-right,0px),calc((100vw - 1180px)/2));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .box{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
img,table{max-width:100%}
/* Petits téléphones */
@media (max-width:359px){
  body{zoom:.92}
  .logo{width:38px;height:38px}
  .mid{min-width:54px}
  .week button{padding:6px 10px}
}
/* Tablettes, téléphones à l'horizontale, écrans pliables ouverts : cartes sur plusieurs colonnes */
@media (min-width:700px){
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));column-gap:12px;align-items:start}
  main > *{grid-column:1/-1;min-width:0}
  main > .match, main > .club, main > .favrow{grid-column:auto}
  .sheet{align-items:center;justify-content:center}
  .sheet .box{max-width:560px;border-radius:18px;border:1px solid var(--line);max-height:85vh}
}
/* Téléphone à l'horizontale : l'en-tête ne reste plus collé pour libérer de la hauteur */
@media (orientation:landscape) and (max-height:500px){
  header{position:static}
  .sheet .box{max-height:94vh}
}
.refresh.spin{animation:sp .8s linear infinite}
/* ===== Thème clair ===== */
html.light{
  --bg:#F2F5FA; --card:#FFFFFF; --card2:#E8EEF7; --line:#D3DCE9;
  --txt:#111D30; --mute:#5A6B85; --txt2:#24344F; --orange2:#D45510;
  --win:#12864A; --lose:#C62E44; --err:#B3261E; --shadow:rgba(20,35,60,.15);
}
html.light .match,html.light .club,html.light .div,html.light .favrow{box-shadow:0 1px 3px var(--shadow)}
html.light .logo.ph{color:#24344F}
html.light .b-p,html.light .b-s2{background:#DCE5F2;color:#22324D}
html.light .b-s{background:#D6ECFA;color:#0F4C75}
html.light .b-q{background:#D3F2E2;color:#0E6B3A}
html.light .b-z,html.light .b-d{background:#FFE3CF;color:#8A3D0C}
html.light .b-c{background:#FBD7DD;color:#8E1B2E}
html.light .b-m{background:#FFF0C7;color:#6E5200}
html.light .ffbblink{background:linear-gradient(90deg,#2453A8,#3B6FD1);border-color:#2453A8;color:#fff}
html.light .ffbblink small{color:#DCE7FF}
html.light #toast,html.light #ptr{box-shadow:0 6px 18px var(--shadow)}
html.light .sheet .box{box-shadow:0 -6px 24px var(--shadow)}
.themes{display:flex;gap:6px;margin-top:4px}.themes .chip{flex:1;text-align:center;padding:9px 6px}
.pbar{position:relative;height:20px;min-width:74px;background:var(--card2);border-radius:6px;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.pbar i.pu{background:linear-gradient(90deg,#1E9E5A,#3CCB7F)}.pbar i.pd{background:linear-gradient(90deg,#C62E44,#E5576B)}
.pbar span{position:relative;font-size:11.5px;font-weight:800;line-height:20px;color:var(--txt)}
table.prob td{padding:6px 3px}
.stags{display:grid;gap:6px;margin:4px 0 10px}
.stag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.stag b{display:block;font-size:14px}.stag span{font-size:12px;color:var(--mute)}
.form{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-size:11px;font-weight:900;margin-right:3px;color:#fff}.form.fw{background:#1E9E5A}.form.fl{background:#C62E44}
.stylebtn{background:none;border:1px solid var(--line);color:var(--orange2);border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700;margin-top:4px}
td.tm .sty{cursor:pointer}
.srow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.srow .logo{width:34px;height:34px;font-size:11px}.sinfo{flex:1;min-width:0}.sinfo b{font-size:14px}
.stl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 3px}.stl .badge2{margin-left:0}
.ssub{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sform .form{width:18px;height:18px;line-height:18px;font-size:10px;margin-right:2px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.5}
.pv > b{display:block;font-size:14.5px;margin-bottom:2px}.pv p{margin:4px 0}.pv ul{margin:4px 0;padding-left:20px}.pv li b{display:inline;font-size:inherit}
.pv a{color:var(--orange2)}
#pvNotice{position:fixed;left:10px;right:10px;bottom:12px;z-index:65;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;line-height:1.45;color:var(--txt);box-shadow:0 8px 24px var(--shadow)}
#pvNotice .pvb{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.wp{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:12px;color:var(--mute)}
.wp b{min-width:38px;text-align:center;font-weight:800}.wp b.fav{color:var(--orange2)}
.wpbar{flex:1;height:6px;border-radius:4px;background:#5A7BB5;overflow:hidden}.wpbar i{display:block;height:100%;background:var(--orange)}
.cathd{display:flex;align-items:center;gap:8px;width:100%;margin:14px 0 6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);text-align:left}
.cathd .cn{font-weight:900;font-size:16px;color:var(--orange2)}.cathd .cs{font-weight:700;font-size:13px}.cathd .cc{margin-left:auto;font-size:12px;color:var(--mute)}.cathd i{font-style:normal;color:var(--mute);font-size:12px}
.rday{font-size:12px;color:var(--mute);margin:8px 4px 2px;text-transform:capitalize}
.foldbar{display:flex;gap:8px;margin:8px 0 2px}.foldbar .chip{flex:1;text-align:center;padding:8px 6px}
.search{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;max-height:min(60vh,420px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow,rgba(0,0,0,.35));padding:4px 0}

<script>
/* ===== Thème : auto / clair / sombre ===== */
(function(){
  function sysDark(){
    try{ if (window.AndroidBridge && AndroidBridge.isSystemDark) return AndroidBridge.isSystemDark(); }catch(e){}
    return !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function pref(){ try{ return JSON.parse(localStorage.getItem("theme")) || "auto"; }catch(e){ return "auto"; } }
  window.applyTheme = function(){
    const p = pref(), dark = p === "dark" || (p === "auto" && sysDark());
    document.documentElement.classList.toggle("light", !dark);
    try{ if (window.AndroidBridge && AndroidBridge.setLightBars) AndroidBridge.setLightBars(!dark); }catch(e){}
  };
  window.setThemePref = function(p){ try{ localStorage.setItem("theme", JSON.stringify(p)); }catch(e){} applyTheme(); };
  window.onSystemTheme = function(){ applyTheme(); };
  if (window.matchMedia) try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); }catch(e){}
  applyTheme();
})();
</script>
<script>
"use strict";
/* ================= Config ================= */
const API = "https://api.ffbb.app/";
const MEILI = "https://meilisearch-prod.ffbb.app/";
const IDX_R = "ffbbserver_rencontres";
const IDX_O = "ffbbserver_organismes";
const CAT_ORDER = ["U7","U9","U11","U13","U15","U17","U18","U20","U21","SE","SEN","SENIORS","VET","LOISIR"];

/* ================= Stockage ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= HTTP (pont natif ou fetch) ================= */
let reqSeq = 0; const pending = {};
window.__nativeCb = function(id, status, text){
  const p = pending[id]; if(!p) return; delete pending[id];
  p({status, text});
};
function http(method, url, headers, body){
  if (window.AndroidBridge && window.AndroidBridge.request && !window.__useWebFetch){
    return new Promise(res => {
      const id = "r" + (++reqSeq); pending[id] = res;
      window.AndroidBridge.request(id, method, url, JSON.stringify(headers||{}), body||"");
    }).then(r => {
      // échec natif (certificat…) : on retente via le moteur du navigateur
      if (r.status === 0) return webFetch(method, url, headers, body).then(w => { if (w.status) window.__useWebFetch = true; return w.status ? w : r; });
      return r;
    });
  }
  return webFetch(method, url, headers, body);
}
function webFetch(method, url, headers, body){
  return fetch(url, {method, headers, body: body||undefined})
    .then(r => r.text().then(t => ({status:r.status, text:t})))
    .catch(e => ({status:0, text:"Erreur réseau : "+e.message}));
}
async function httpJson(method, url, headers, body){
  const r = await http(method, url, headers, body);
  if (r.status < 200 || r.status >= 300) {
    const e = new Error("HTTP " + r.status + " — " + (r.text||"").slice(0,200)); e.status = r.status; throw e;
  }
  return JSON.parse(r.text);
}

/* ================= Jetons FFBB ================= */
async function getTokens(force){
  const c = store.get("tokens", null);
  if (!force && c && c.ms && Date.now() - c.t < 6*3600e3) return c;
  const j = await httpJson("GET", API + "items/configuration", {});
  const d = j && j.data ? j.data : j;
  const t = { ms: d.key_ms, dh: d.key_dh, t: Date.now() };
  if (!t.ms) throw new Error("Jeton de recherche FFBB introuvable");
  store.set("tokens", t); return t;
}
async function multiSearch(queries, retried){
  const tk = await getTokens(retried);
  try{
    const j = await httpJson("POST", MEILI + "multi-search",
      {"Authorization":"Bearer " + tk.ms, "Content-Type":"application/json"},
      JSON.stringify({queries}));
    return j.results || [];
  }catch(e){
    if (!retried && (e.status === 401 || e.status === 403)) return multiSearch(queries, true);
    throw e;
  }
}
const q = s => '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';

/* ================= Week-end ================= */
function weekendRange(offset){
  const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const wd = d.getDay(); // 0 dim … 6 sam
  // vendredi de référence : si on est ven/sam/dim → ce week-end, sinon le prochain
  let toFri = 5 - wd; if (wd === 6) toFri = -1; if (wd === 0) toFri = -2;
  const fri = new Date(d); fri.setDate(d.getDate() + toFri + offset*7);
  const end = new Date(fri); end.setDate(fri.getDate() + 2); end.setHours(23,59,59,999);
  return { start: fri, end };
}
function fmtDay(d){ return d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}); }
function fmtShort(d){ return d.toLocaleDateString("fr-FR",{day:"numeric", month:"short"}); }

/* ================= Comité organisateur (Essonne) ================= */
async function findComite(range){
  const saved = store.get("comite", null);
  if (saved && (saved.id || saved.nom)) return saved;
  // 1) annuaire des organismes
  try{
    const [r] = await multiSearch([{indexUid: IDX_O, q: "comite essonne", limit: 30}]);
    const hit = (r && r.hits || []).find(h => /comit/i.test(h.nom||"") && /essonne/i.test(h.nom||""));
    if (hit){ const c = {id: String(hit.id), nom: hit.nom}; store.set("comite", c); return c; }
  }catch(e){ /* on tente la méthode suivante */ }
  // 2) organisateurs présents sur la période
  const tf = tsFilter(range);
  const [r2] = await multiSearch([{indexUid: IDX_R, q: "", limit: 0, filter: [tf], facets: ["organisateur.nom"]}]);
  const names = Object.keys((r2 && r2.facetDistribution && r2.facetDistribution["organisateur.nom"]) || {});
  const nm = names.find(n => /essonne/i.test(n)) || names.find(n => /\b91\b/.test(n));
  if (nm){ const c = {nom: nm}; store.set("comite", c); return c; }
  throw new Error("Comité de l'Essonne introuvable dans les données FFBB. Renseigne son nom dans ⚙️ Réglages.");
}
function tsFilter(range){
  // le timestamp peut être en secondes ou millisecondes : on couvre les deux (+/- 3 h de marge)
  const a = Math.floor(range.start.getTime()/1000) - 3*3600, b = Math.floor(range.end.getTime()/1000) + 3*3600;
  const f = "date_rencontre_timestamp";
  return `(${f} >= ${a} AND ${f} <= ${b}) OR (${f} >= ${a*1000} AND ${f} <= ${b*1000})`;
}
function comiteFilter(c){
  const parts = [];
  if (c.id) parts.push(`organisateur.id = ${q(c.id)}`);
  if (c.nom) parts.push(`organisateur.nom = ${q(c.nom)}`);
  return parts.join(" OR ");
}

/* ================= Chargement des matchs ================= */
async function loadMatches(range){
  let comite = await findComite(range);
  let res = await fetchMatches(range, comite);
  if (!res.length && range.end < new Date()){
    // le moteur de recherche FFBB ne garde que ~1 semaine : on interroge la base FFBB pour les week-ends plus anciens
    try{ res = await fetchMatchesDirectus(range, comite); }catch(e){ S.oldErr = e.message || String(e); }
    return res;
  }
  if (!res.length && !comite.manual){
    // la détection via l'annuaire a pu donner un nom/ID différent : on tente via les organisateurs de la période
    const tf = tsFilter(range);
    const [r2] = await multiSearch([{indexUid: IDX_R, q: "", limit: 0, filter: [tf], facets: ["organisateur.nom"]}]);
    const names = Object.keys((r2 && r2.facetDistribution && r2.facetDistribution["organisateur.nom"]) || {});
    const nm = names.find(n => /essonne/i.test(n));
    if (nm && nm !== comite.nom){ comite = {nom: nm}; store.set("comite", comite); res = await fetchMatches(range, comite); }
  }
  return res;
}
const RENC_FIELDS = ["id","date","date_rencontre","horaire","numeroJournee","nomEquipe1","nomEquipe2","resultatEquipe1","resultatEquipe2","joue",
  "competitionId.id","competitionId.nom","competitionId.code","competitionId.sexe","competitionId.categorie.code","competitionId.categorie.libelle","competitionId.categorie.ordre",
  "idPoule.id","idPoule.nom","salle.libelle","salle.adresse","salle.cartographie.ville","salle.cartographie.codePostal","salle.cartographie.latitude","salle.cartographie.longitude",
  "idOrganismeEquipe1.id","idOrganismeEquipe1.nom","idOrganismeEquipe1.code","idOrganismeEquipe1.logo",
  "idOrganismeEquipe2.id","idOrganismeEquipe2.nom","idOrganismeEquipe2.code","idOrganismeEquipe2.logo"];
function isoLocal(d){ const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
async function fetchMatchesDirectus(range, comite){
  if (!comite.id) throw new Error("ID du comité inconnu");
  const filter = JSON.stringify({_and: [
    {competitionId: {organisateur: {_eq: comite.id}}},
    {date_rencontre: {_between: [isoLocal(range.start), isoLocal(range.end)]}}
  ]});
  const j = await directusGet("items/ffbbserver_rencontres", RENC_FIELDS, ["limit=2000", "filter=" + encodeURIComponent(filter)]);
  return ((j && j.data) || []).map(normalize).filter(m => m.date && m.date >= range.start && m.date <= range.end);
}
async function fetchMatches(range, comite){
  const filter = [tsFilter(range), comiteFilter(comite)];
  let all = [], offset = 0, total = Infinity;
  while (offset < total && offset < 3000){
    const [r] = await multiSearch([{indexUid: IDX_R, q: "", limit: 500, offset, filter}]);
    const hits = (r && r.hits) || [];
    all = all.concat(hits);
    total = r && (r.estimatedTotalHits != null ? r.estimatedTotalHits : r.totalHits != null ? r.totalHits : hits.length);
    if (hits.length < 500) break;
    offset += 500;
  }
  return all.map(normalize).filter(m => m.date && m.date >= new Date(range.start.getTime()) && m.date <= range.end);
}

/* ================= Normalisation ================= */
function logoId(x){
  if (!x) return null;
  if (typeof x === "string") return x;
  if (typeof x === "object") return x.id || null;
  return null;
}
function parseDate(h){
  let s = h.date_rencontre || h.date;
  if (s){
    const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ","T"));
    if (!isNaN(d)) {
      // si l'heure est 00:00 et "horaire" est fourni (ex. 1530)
      if (d.getHours()===0 && d.getMinutes()===0 && h.horaire && /^\d{3,4}$/.test(String(h.horaire))){
        const hh = String(h.horaire).padStart(4,"0"); d.setHours(+hh.slice(0,2), +hh.slice(2));
      }
      return d;
    }
  }
  let t = h.date_rencontre_timestamp; if (t){ if (t < 1e11) t *= 1000; return new Date(t); }
  return null;
}
function catOf(h){
  const c = (h.competitionId && h.competitionId.categorie) || {};
  let code = (c.code || "").toUpperCase();
  if (!code){
    const m = /(U\d{1,2})/i.exec((h.competitionId && h.competitionId.nom) || "");
    code = m ? m[1].toUpperCase() : ((/senior/i.test((h.competitionId && h.competitionId.nom)||"")) ? "SE" : "Autre");
  }
  return { code, libelle: c.libelle || code, ordre: c.ordre != null ? +c.ordre : null };
}
function sexeOf(h){
  const s = ((h.competitionId && h.competitionId.sexe) || h.sexe || "").toString().toLowerCase();
  if (s.startsWith("f")) return "F"; if (s.startsWith("m")) return "M"; if (s.startsWith("x")||s.includes("mixte")) return "X";
  return "";
}
function team(h, n){
  const org = h["idOrganismeEquipe"+n] || {}; const eng = h["idEngagementEquipe"+n] || {};
  return {
    nom: h["nomEquipe"+n] || eng.nom || org.nom || "?",
    club: org.nom || "", clubId: org.id ? String(org.id) : "", code: org.code || "",
    logo: logoId(org.logo) || logoId(eng.logo),
    score: h["resultatEquipe"+n]
  };
}
function cleanName(x){
  if (!x) return "";
  x = String(x);
  if (x.includes("|")){
    // format FFBB "id|Nom|uuid|DIV|…" : on garde le premier morceau qui ressemble à un nom
    const parts = x.split("|").map(t => t.trim()).filter(Boolean);
    return parts.find(t => /[A-Za-zÀ-ÿ]{3,}/.test(t) && !/^[0-9a-f-]{20,}$/i.test(t)) || parts[0] || "";
  }
  return x;
}
function compName(comp, h){
  return cleanName(comp.nom) || cleanName(comp.nomExtended) || cleanName(h.nomExtended) || "Compétition";
}
function normalize(h){
  const s = h.salle || {}; const com = (s.commune && typeof s.commune === "object") ? s.commune : {};
  const carto = (s.cartographie && typeof s.cartographie === "object") ? s.cartographie : {};
  const cc = carto.coordonnees && carto.coordonnees.coordinates;
  const geo = h._geo || (carto.latitude ? {lat: +carto.latitude, lng: +carto.longitude} : (cc ? {lat: cc[1], lng: cc[0]} : null));
  const cat = catOf(h);
  const comp = h.competitionId || {};
  const t1 = team(h,1), t2 = team(h,2);
  const joue = !!h.joue || (t1.score!=null && t1.score!=="" && t2.score!=null && t2.score!=="" && +t1.score + +t2.score > 0);
  return {
    id: String(h.id || h.uniqueKey || Math.random()),
    date: parseDate(h), cat, sexe: sexeOf(h),
    comp: compName(comp, h),
    compCode: comp.code || "", compId: comp.id ? String(comp.id) : "", pouleId: (h.idPoule && h.idPoule.id) ? String(h.idPoule.id) : "", poule: (h.idPoule && h.idPoule.nom) || "", journee: h.numeroJournee,
    t1, t2, joue,
    salle: { nom: s.libelle || s.libelle2 || "", adresse: [s.adresse, s.adresseComplement].filter(Boolean).join(" "),
             cp: com.codePostal || carto.codePostal || "", ville: com.libelle || carto.ville || "", geo },
    officiels: h.officiels_string || ""
  };
}

/* ================= Logos ================= */
function logoUrl(id, withToken){
  let u = API + "assets/" + encodeURIComponent(id) + "?width=120&height=120&fit=contain&format=png";
  if (withToken){ const t = store.get("tokens", {}); if (t.dh) u += "&access_token=" + encodeURIComponent(t.dh); }
  return u;
}
function initials(n){
  const w = String(n||"?").replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").split(/\s+/).filter(x => x && x.length>1 && !/^(de|du|des|la|le|les|et|basket|bc|ball)$/i.test(x));
  return (w.slice(0,2).map(x => x[0]).join("") || "?").toUpperCase();
}
function logoHtml(t){
  const ph = `<div class="logo ph">${esc(initials(t.club||t.nom))}</div>`;
  if (!t.logo) return ph;
  return `<img class="logo" loading="lazy" alt="" src="${logoUrl(t.logo)}" data-id="${esc(t.logo)}" data-ini="${esc(initials(t.club||t.nom))}" onerror="logoErr(this)">`;
}
window.logoErr = function(img){
  if (!img.dataset.tok){ img.dataset.tok = "1"; img.src = logoUrl(img.dataset.id, true); return; }
  const d = document.createElement("div"); d.className = "logo ph"; d.textContent = img.dataset.ini || "?"; img.replaceWith(d);
};

/* ================= État & rendu ================= */
const S = { offset: 0, matches: [], cat: "ALL", sexe: "ALL", q: "", tab: "matchs", loading: false, error: null, club: null,
            favs: store.get("favs", []), results: null, resWeeks: 4, resLoading: false, resError: null, open: {}, ranks: {} };
const src = () => S.tab === "res" ? (S.results || []) : (S.tab === "cls" || S.tab === "up" || S.tab === "sty") ? allKnown() : S.matches;
function allKnown(){ const seen = {}, out = []; [S.matches, S.results || []].forEach(l => l.forEach(m => { if (!seen[m.id]){ seen[m.id] = 1; out.push(m); } })); return out; }
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function catSortKey(c){
  if (c.ordre != null) return c.ordre;
  const i = CAT_ORDER.findIndex(x => c.code.startsWith(x)); return i < 0 ? 99 : i;
}
function filtered(){
  const words = norm(S.q).split(/\s+/).filter(Boolean);
  return src().filter(m => {
    if (S.tab === "res" && !m.joue) return false;
    if (S.cat !== "ALL" && m.cat.code !== S.cat) return false;
    if (S.sexe !== "ALL" && m.sexe !== S.sexe) return false;
    if (S.club && m.t1.clubId !== S.club && m.t2.clubId !== S.club) return false;
    if (S.tab === "favs" && !isFavMatch(m)) return false;
    if (!words.length) return true;
    const hay = norm([m.t1.nom, m.t2.nom, m.t1.club, m.t2.club, m.salle.nom, m.salle.ville, m.comp, m.cat.libelle].join(" "));
    return words.every(w => hay.includes(w));
  });
}
function favKey(t){ return "n:" + norm(t.nom); }                 // équipe précise (ex. « ES BRUNOY - 1 »)
function clubKey(t){ return t.clubId ? "c:" + t.clubId : ""; }      // toutes les équipes d'un club
function isFavTeam(t){ return S.favs.some(f => f.key === favKey(t) || (clubKey(t) && f.key === clubKey(t))); }
function isFavMatch(m){ return isFavTeam(m.t1) || isFavTeam(m.t2); }

function renderWeek(){
  const r = weekendRange(S.offset);

function renderChips(){

  $("sexes").innerHTML = sx.map(([k,l]) => `<button class="chip ${S.sexe===k?"on":""}" data-sexe="${k}">${l}</button>`).join("") +

function prettyCat(c){
  const s = c.code; if (/^SE/.test(s)) return "Seniors"; if (/^U\d+/.test(s)) return s.match(/^U\d+/)[0]; return c.libelle || s;
}
function clubName(id){
  for (const m of S.matches){ if (m.t1.clubId===id) return m.t1.club || m.t1.nom; if (m.t2.clubId===id) return m.t2.club || m.t2.nom; }
  return "Club";
}

function matchCard(m){
  const noHour = m.date && m.date.getHours() === 0 && m.date.getMinutes() === 0;
  const hr = m.date && !noHour ? m.date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "Horaire à venir";
  const s1 = +m.t1.score, s2 = +m.t2.score;
  const nowT = Date.now();
  const enCours = !m.joue && m.date && !noHour && m.date.getTime() <= nowT && nowT - m.date.getTime() < 2.25*3600e3;
  const lv = !m.joue ? liveOf(m) : null;
  const mid = lv ? `<div class="sc" style="color:#FF6B7F">${esc(lv.score_home ?? 0)} - ${esc(lv.score_out ?? 0)}</div><div class="st">● ${esc(liveLabel(lv))}</div>`
            : m.joue ? `<div class="sc">${esc(m.t1.score)} - ${esc(m.t2.score)}</div><div class="st">Terminé · ${hr}</div>`
                     : enCours ? `<div class="hr" style="color:#FF6B7F">● ${hr}</div><div class="st">En cours</div>`
                     : `<div class="hr">${hr}</div><div class="st">${m.journee ? "J" + esc(m.journee) : ""}</div>`;
  const sexe = m.sexe === "F" ? " F" : m.sexe === "M" ? " M" : "";
  return `<div class="match" data-id="${esc(m.id)}">
    <div class="top"><span class="cat">${esc(prettyCat(m.cat))}${sexe}</span><span class="comp">${esc(m.comp)}${m.poule ? " · " + esc(m.poule) : ""}</span></div>
    <div class="teams">
      <div class="team ${m.joue && s1>s2 ? "win":""}">${logoHtml(m.t1)}<div class="nm">${esc(m.t1.nom)}</div>${miniStar(m.t1)}</div>
      <div class="mid">${mid}</div>
      <div class="team ${m.joue && s2>s1 ? "win":""}">${logoHtml(m.t2)}<div class="nm">${esc(m.t2.nom)}</div>${miniStar(m.t2)}</div>
    </div>
    ${!m.joue && !lv ? wpBar(m) : ""}
    <div class="gym">📍 <span><b>${esc(m.salle.nom || "Gymnase non précisé")}</b>${m.salle.ville ? " · " + esc(m.salle.ville) : ""}</span>
      ${m.salle.nom || m.salle.geo ? `<button class="go" data-go="${esc(m.id)}">Itinéraire</button>` : ""}</div>
  </div>`;
}

function renderMain(){
  const main = $("main");
  if (S.loading){ main.innerHTML = `<div class="load"><div class="spinner"></div>Chargement des matchs du week-end…</div>`; return; }
  if (S.error){ main.innerHTML = `<div class="err">⚠️ ${esc(S.error)}<br><button onclick="reload(true)">Réessayer</button></div>`; return; }
  const list = filtered();
  if (S.tab === "nba") return renderNba();
  if (S.tab === "live") return renderLive();
  if (S.tab === "res") return renderResults(list);
  if (S.tab === "cls") return renderStandings(list);
  if (S.tab === "up") return renderProba(list);
  if (S.tab === "sty") return renderStyles(list);
  if (S.tab === "clubs") return renderClubs(list);
  if (S.tab === "gyms") return renderGyms(list);
  if (S.tab === "matchs" && !S.homeAll) return renderHome(list);
  const favHead = S.tab === "favs" ? favManager() : (S.tab === "matchs" ? homeToggle(list.length) : "");
  if (!list.length){
    main.innerHTML = favHead + `<div class="empty">${S.tab==="favs" ? (S.favs.length ? "Aucun match de tes équipes favorites ce week-end." : "Pas encore de favoris.<br>Touche ＋ Ajouter, ou ☆ sous une équipe dans un match.") : S.matches.length ? "Aucun match ne correspond à ta recherche." : "Aucun match départemental trouvé pour ce week-end<br>(vacances scolaires ou trêve ?)."}</div>`;
    return;
  }
  list.sort((a,b) => (a.date - b.date) || catSortKey(a.cat) - catSortKey(b.cat));
  let html = "", lastDay = "";
  for (const m of list){
    const day = m.date ? fmtDay(m.date) : "Date inconnue";
    if (day !== lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    html += matchCard(m);
  }
  html += `<div class="stat">${list.length} match${list.length>1?"s":""} · Données FFBB</div>`;
  main.innerHTML = favHead + html;
}
/* ===== Regroupement par catégorie (repliable) ===== */
S.fold = store.get("fold", {});
function sexLabel(x){ return x === "F" ? "Féminines" : x === "M" ? "Masculins" : x === "X" ? "Mixtes" : ""; }
function catGroups(list){
  const g = {};
  list.forEach(m => { const k = m.cat.code + "|" + (m.sexe || ""); (g[k] = g[k] || {cat: m.cat, sexe: m.sexe, k, items: []}).items.push(m); });
  return Object.values(g).sort((a,b) => catSortKey(a.cat) - catSortKey(b.cat) || a.cat.code.localeCompare(b.cat.code) || (a.sexe||"").localeCompare(b.sexe||""));
}
function catHead(tab, grp, count, unit){
  const key = tab + ":" + grp.k, closed = !!S.fold[key];
  return `<button class="cathd" data-fold="${esc(key)}"><span class="cn">${esc(prettyCat(grp.cat))}</span><span class="cs">${esc(sexLabel(grp.sexe))}</span><span class="cc">${count} ${unit}${count>1?"s":""}</span><i>${closed ? "▼" : "▲"}</i></button>`;
}
function isFolded(tab, grp){ return !!S.fold[tab + ":" + grp.k]; }
function foldBar(tab){
  return `<div class="foldbar"><button class="chip" data-foldall="${tab}:open">▼ Tout déplier</button><button class="chip" data-foldall="${tab}:close">▲ Tout replier</button></div>`;
}
function foldAll(tab, open){
  // catégories
  Object.keys(S.fold).forEach(k => { if (k.startsWith(tab + ":")) delete S.fold[k]; });
  if (!open){
    const list = filtered();
    if (tab === "res") catGroups(list.filter(m => m.joue)).forEach(g => S.fold["res:" + g.k] = 1);
    else catGroups(list.filter(m => m.pouleId || m.poule)).forEach(g => S.fold["cls:" + g.k] = 1);
  }
  store.set("fold", S.fold);
  // Compétitions : ouvre ou ferme aussi toutes les poules
  if (tab === "cls"){
    const tree = pouleTree(filtered());
    const all = []; tree.forEach(c => c.divs.forEach(d => d.poules.forEach(e => all.push(e))));
    if (open){ all.forEach(([pk]) => S.open[pk] = true); queueRankings(all); }
    else S.open = {};
  }
  renderMain();
}

function renderResults(list){
  const main = $("main");
  if (S.resLoading){ main.innerHTML = `<div class="load"><div class="spinner"></div>Récupération des résultats FFBB des ${S.resWeeks} derniers week-ends…</div>`; return; }
  if (S.resError){ main.innerHTML = `<div class="err">⚠️ ${esc(S.resError)}<br><button onclick="loadResults(true)">Réessayer</button></div>`; return; }
  if (!S.results){ loadResults(); return; }
  const more = `<button class="btn sec" onclick="moreResults()">Charger 4 week-ends de plus</button>` + ffbbBtn(FFBB_COMITE, "🌐 Tous les résultats de l'Essonne sur FFBB ↗");
  if (!list.length){ main.innerHTML = ffbbEssonneBanner() + `<div class="empty">Aucun résultat trouvé.${S.oldErr ? "<br>⚠️ " + esc(S.oldErr) : ""}</div>` + more; return; }
  let html = ffbbEssonneBanner() + foldBar("res");
  for (const grp of catGroups(list)){
    html += catHead("res", grp, grp.items.length, "résultat");
    if (isFolded("res", grp)) continue;
    // compétition (division) puis matchs du plus récent au plus ancien
    const comps = {};
    grp.items.forEach(m => (comps[m.comp] = comps[m.comp] || []).push(m));
    Object.entries(comps).sort((a,b) => divRank(a[0]) - divRank(b[0]) || a[0].localeCompare(b[0])).forEach(([comp, ms]) => {
      html += `<div class="group">${esc(comp)} · ${ms.length}</div>`;
      let lastDay = "";
      ms.sort((a,b) => b.date - a.date).forEach(m => {
        const day = fmtDay(m.date); if (day !== lastDay){ html += `<div class="rday">${esc(day)}</div>`; lastDay = day; }
        html += matchCard(m);
      });
    });
  }
  html += `<div class="stat">${list.length} résultat${list.length>1?"s":""} · Données FFBB</div>`;
  if (S.oldErr) html += `<div class="stat">⚠️ Certains week-ends anciens n'ont pas pu être récupérés : ${esc(S.oldErr)}</div>`;
  html += more;
  main.innerHTML = html;
}
function weekendOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = x.getDay();
  const back = wd === 5 ? 0 : wd === 6 ? 1 : wd === 0 ? 2 : wd + 2; x.setDate(x.getDate() - back); return x;
}
async function loadResults(force){
  if (S.resLoading) return;
  if (force) S.results = null; S.oldErr = null;
  S.resLoading = true; S.resError = null; if (S.tab === "res") renderMain();
  try{
    const now = new Date(); let all = [];
    for (let w = 0; w >= -S.resWeeks; w--){
      const r = weekendRange(w); if (r.start > now) continue;
      const key = "res" + w;
      if (!cache[key] || w === 0){
        try{ cache[key] = (await loadMatches({start: r.start, end: r.end < now ? r.end : now})).filter(m => m.joue); }
        catch(e){ S.oldErr = e.message || String(e); continue; }
      }
      all = all.concat(cache[key]);
      S.results = all; if (S.tab === "res" || S.tab === "cls" || S.tab === "up" || S.tab === "sty"){ S.resLoading = false; renderChips(); renderMain(); S.resLoading = true; }
    }
    S.results = all;
  }catch(err){ S.resError = (err && err.message) || String(err); }
  finally{ S.resLoading = false; if (S.tab === "res" || S.tab === "cls" || S.tab === "up" || S.tab === "sty"){ renderChips(); renderMain(); } }
}
function moreResults(){ S.resWeeks += 4; loadResults(true); }
window.loadResults = loadResults; window.moreResults = moreResults;

/* ================= Classements ================= */
function divisionKey(m){ return m.compId || m.comp; }
function renderStandings(list){
  const main = $("main");
  // Catégorie → Division (compétition) → Poule
  const cats = {};
  list.forEach(m => {
    if (!m.pouleId && !m.poule) return;
    const ck = m.cat.code + "|" + (m.sexe || "");
    const c = cats[ck] = cats[ck] || {cat: m.cat, sexe: m.sexe, k: ck, divs: {}};
    const dk = divisionKey(m);
    const d = c.divs[dk] = c.divs[dk] || {nom: m.comp, sexe: m.sexe, poules: {}};
    const pk = m.pouleId || (dk + "|" + m.poule);
    const p = d.poules[pk] = d.poules[pk] || {id: m.pouleId, nom: m.poule || "Poule unique", teams: {}, compCode: m.compCode};
    [m.t1, m.t2].forEach(t => { p.teams[t.nom] = t; });
  });
  const catArr = Object.values(cats).sort((a,b) => catSortKey(a.cat) - catSortKey(b.cat) || a.cat.code.localeCompare(b.cat.code) || (a.sexe||"").localeCompare(b.sexe||""));
  if (!catArr.length){
    main.innerHTML = S.resLoading ? `<div class="load"><div class="spinner"></div>Recherche des divisions et poules…</div>` : `<div class="empty">Aucune poule trouvée.</div>`;
    return;
  }
  let html = foldBar("cls") + (S.resLoading ? `<div class="stat">⏳ Recherche d'autres poules en cours…</div>` : "");
  for (const c of catArr){
    const nPoules = Object.values(c.divs).reduce((s, d) => s + Object.keys(d.poules).length, 0);
    html += catHead("cls", c, nPoules, "poule");
    if (isFolded("cls", c)) continue;
    const divs = Object.values(c.divs).sort((a,b) => divRank(a.nom) - divRank(b.nom) || a.nom.localeCompare(b.nom));
    for (const d of divs){
      const poules = Object.entries(d.poules).sort((a,b) => a[1].nom.localeCompare(b[1].nom, "fr", {numeric:true}));
      html += `<div class="div"><div class="hd">${esc(d.nom)}<span>${poules.length} poule${poules.length>1?"s":""}</span></div>`;
      for (const [pk, p] of poules){
        const open = !!S.open[pk];
        html += `<div class="pl"><div class="ph2" data-poule="${esc(pk)}" data-pid="${esc(p.id||"")}">${esc(p.nom)} <i>${open ? "▲" : "▼ Calendrier · Classement"}</i></div>`;
        if (open) html += rankTable(pk, p);
        html += `</div>`;
      }
      html += `</div>`;
    }
  }
  main.innerHTML = html;
}
function divRank(nom){
  const n = norm(nom);
  if (/elite|excellence/.test(n)) return 0;
  const m = /(?:division|d[mf]?|niveau|div\.?)\s*(\d)/.exec(n); if (m) return +m[1];
  if (/honneur/.test(n)) return 3; if (/promotion/.test(n)) return 4;
  return 9;
}
function rankTable(pk, p){
  const r = S.ranks[pk];
  if (!r || r.loading) return `<div class="mini"><div class="spinner" style="width:22px;height:22px;border-width:3px;margin:6px auto"></div></div>`;
  const view = r.view || "cal";
  let html = `<div class="chips" style="padding:0 12px 8px"><button class="chip ${view==="cal"?"on":""}" data-pview="cal" data-pk="${esc(pk)}">Calendrier</button><button class="chip ${view==="rk"?"on":""}" data-pview="rk" data-pk="${esc(pk)}">Classement</button></div>`;
  const site = `<div style="padding:0 12px 10px">${ffbbBtn(ffbbCompUrl(p.compCode), "📊 Voir cette compétition sur FFBB ↗")}</div>`;
  if (view === "cal") return html + calTable(pk, p, r) + site;
  if (r.rankError) return html + `<div class="mini">⚠️ ${esc(r.rankError)} <button class="chip" data-poule-retry="${esc(pk)}">Réessayer</button></div>`;
  if (!r.rows || !r.rows.length) return html + `<div class="mini">Classement pas encore disponible sur la FFBB.</div>`;
  const favKeys = new Set(S.favs.map(f => f.key));
  const pp = pouleFromKey(pk), pctx = pp.cat ? ctxStr(pp.cat, pp.sexe) : "";
  return html + `<table class="rk"><tr><th>#</th><th style="text-align:left">Équipe</th><th>Pts</th><th>J</th><th>G</th><th>P</th><th>GA</th></tr>` +
    r.rows.map(x => {
      const t = matchTeam(p, x);
      const me = t ? isFavTeam(t) : favKeys.has("n:" + norm(x.nom));
      return `<tr class="${me?"me":""}"><td>${esc(x.position || "")}</td><td class="tm sty" data-style="${esc(x.nom)}" data-sctx="${esc(pctx)}" data-sclub="${esc(x.clubId || "")}">${logoHtml({logo: x.logo || (t && t.logo), club: x.club, nom: x.nom})}${esc(x.nom)} <span style="color:var(--orange2)">🧠</span></td>
        <td class="pts">${esc(x.points)}</td><td>${esc(x.joues)}</td><td>${esc(x.gagnes)}</td><td>${esc(x.perdus)}</td><td>${x.diff>0?"+":""}${esc(x.diff)}</td></tr>`;
    }).join("") + `</table><div class="mini">Classement officiel FFBB</div>` + site;
}
function calTable(pk, p, r){
  const ms = r.matches || [];
  if (!ms.length) return `<div class="mini">${r.calError ? "⚠️ " + esc(r.calError) + ` <button class="chip" data-poule-retry="${esc(pk)}">Réessayer</button>` : "Aucun match trouvé pour cette poule."}</div>`;
  const js = [...new Set(ms.map(m => +m.journee || 0))].sort((a,b) => a - b);
  if (r.j == null || !js.includes(r.j)){
    // journée par défaut : la première qui n'est pas entièrement jouée, sinon la dernière
    const next = js.find(j => ms.some(m => (+m.journee||0) === j && !m.joue));
    r.j = next != null ? next : js[js.length - 1];
  }
  let html = `<div class="chips" style="padding:0 12px 6px">` + js.map(j => `<button class="chip ${j===r.j?"on":""}" data-pj="${j}" data-pk="${esc(pk)}">${j ? "J" + j : "?"}</button>`).join("") + `</div>`;
  const list = ms.filter(m => (+m.journee||0) === r.j).sort((a,b) => (a.date||0) - (b.date||0));
  let lastDay = "";
  html += `<div style="padding:0 8px 8px">`;
  for (const m of list){
    const day = m.date ? fmtDay(m.date) : "Date à venir";
    if (day !== lastDay){ html += `<div class="group" style="margin-left:4px">${esc(day)}</div>`; lastDay = day; }
    html += matchCard(m);
  }
  html += `</div>`;
  if (r.partial) html += `<div class="mini">⚠️ Calendrier partiel (seulement les matchs récents et à venir) : la base complète FFBB n'a pas répondu.</div>`;
  return html;
}
function matchTeam(p, x){
  const teams = Object.values(p.teams);
  return teams.find(t => norm(t.nom) === norm(x.nom)) || teams.find(t => x.clubId && t.clubId === x.clubId) || null;
}

const POULE_RENC_FIELDS = ["id","date","date_rencontre","horaire","numeroJournee","nomEquipe1","nomEquipe2","resultatEquipe1","resultatEquipe2","joue",

function parseRanks(d, p){

function pouleTree(list){
  const cats = {};
  list.forEach(m => {
    if (!m.pouleId && !m.poule) return;
    const c = cats[m.cat.code] = cats[m.cat.code] || {cat: m.cat, divs: {}};
    const dk = divisionKey(m);
    const d = c.divs[dk] = c.divs[dk] || {nom: m.comp, poules: {}};
    const pk = m.pouleId || (dk + "|" + m.poule);
    const p = d.poules[pk] = d.poules[pk] || {id: m.pouleId, nom: m.poule || "Poule unique", teams: {}, compId: m.compId, pouleNom: m.poule, compNom: m.comp, cat: m.cat, sexe: m.sexe};
    p.teams[m.t1.nom] = m.t1; p.teams[m.t2.nom] = m.t2;
  });
  return Object.values(cats).sort((a,b) => catSortKey(a.cat) - catSortKey(b.cat) || a.cat.code.localeCompare(b.cat.code))
    .map(c => ({cat: c.cat, divs: Object.values(c.divs).sort((a,b) => divRank(a.nom) - divRank(b.nom) || a.nom.localeCompare(b.nom))

}

/* Goal-average particulier entre deux équipes (matchs aller/retour entre elles).
   Renvoie {diff, decided} : diff > 0 = avantage à a ; decided = tous leurs matchs sont joués. */
function h2h(a, b, ms){
  const na = norm(a.nom), nb = norm(b.nom);
  const mutual = (ms || []).filter(m => { const x = norm(m.t1.nom), y = norm(m.t2.nom); return (x === na && y === nb) || (x === nb && y === na); });
  if (!mutual.length) return {diff: 0, decided: false, played: 0};
  let diff = 0, played = 0, winsA = 0, winsB = 0;
  mutual.forEach(m => {
    if (!m.joue) return;
    const s1 = parseInt(m.t1.score, 10), s2 = parseInt(m.t2.score, 10); if (isNaN(s1) || isNaN(s2)) return;
    played++;
    const d = norm(m.t1.nom) === na ? s1 - s2 : s2 - s1;
    diff += d; if (d > 0) winsA++; else if (d < 0) winsB++;
  });
  // critère FFBB : d'abord les points des matchs particuliers (victoires), puis l'écart de paniers
  const score = winsA !== winsB ? (winsA - winsB) * 1000 + diff : diff;
  return {diff: score, decided: played === mutual.length && played > 0, played, gaDiff: diff};
}
/* a passe devant b à égalité de points ? true / false / null (pas encore décidé) */
function winsTie(a, b, ms){
  const h = h2h(a, b, ms);
  if (h.decided){ if (h.diff > 0) return true; if (h.diff < 0) return false; }
  return null;
}
function promoAnalysis(r, places){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (!rows.length) return null;
  const ms = r.matches || [];
  const known = !r.partial && ms.length > 0;
  rows.forEach(x => {
    let total = null;
    if (known){
      const n = ms.filter(m => norm(m.t1.nom) === norm(x.nom) || norm(m.t2.nom) === norm(x.nom)).length;
      total = n || null;
    }
    x.reste = total != null ? Math.max(0, total - x.joues) : null;
    x.max = x.reste != null ? x.points + 2 * x.reste : null;
  });
  const cut = rows[Math.min(places, rows.length) - 1];
  const outside = rows.slice(places);
  const bestOutsideMax = outside.length && outside.every(x => x.max != null) ? Math.max(...outside.map(x => x.max)) : (outside.length ? null : -1);
  const out = [];
  rows.forEach((x, i) => {
    let st = null, ga = "";
    if (i < places){
      // assuré si aucune équipe hors zone ne peut le dépasser, égalités départagées au goal-average particulier
      const safeFromAll = bestOutsideMax != null && outside.every(y => y.max < x.points || (y.max === x.points && winsTie(x, y, ms) === true));
      st = safeFromAll ? "q" : "z";
      if (safeFromAll && outside.some(y => y.max === x.points)) ga = "au goal-average particulier";
    }
    else if (x.max == null){ if (cut.points - x.points <= 4) st = "p"; }
    else if (x.max > cut.points) st = "p";
    else if (x.max === cut.points){
      const t = winsTie(x, cut, ms);
      if (t !== false){ st = "p"; ga = t === true ? "gagne le goal-average" : "goal-average à jouer"; }
    }
    if (st) out.push({...x, st, ga, ecart: Math.max(0, cut.points - x.points)});
  });
  return {out, known, finished: known && rows.every(x => x.reste === 0)};
}
function relegAnalysis(r, places){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (rows.length <= places) return null;
  promoAnalysis(r, 1); // calcule reste / max sur chaque ligne
  const n = rows.length, zoneStart = n - places;
  const safe = rows[zoneStart - 1];                  // dernière place sauvée
  const zone = rows.slice(zoneStart);
  const zoneBestMax = zone.every(x => x.max != null) ? Math.max(...zone.map(x => x.max)) : null;
  const out = [];
  rows.forEach((x, i) => {
    let st = null;
    const min = x.reste != null ? x.points + x.reste : null; // défaites = 1 pt
    let ga = "";
    if (i >= zoneStart){
      const condemned = x.max != null && (x.max < safe.points || (x.max === safe.points && winsTie(x, safe, r.matches) === false));
      st = condemned ? "c" : "d";
      if (condemned && x.max === safe.points) ga = "perd le goal-average";
    } else if (zoneBestMax != null && min != null){
      // menacé si une équipe de la zone peut le rattraper (à égalité : goal-average particulier)
      const threats = zone.filter(z => z.max > min || (z.max === min && winsTie(x, z, r.matches) !== true));
      if (threats.length) st = "m";
      else if (zone.some(z => z.max === min)) ga = "sauvé au goal-average";
    } else if (x.points - zone[0].points <= 4){
      st = "m";
    }
    if (st) out.push({...x, st, ga, marge: Math.max(0, x.points - zone[0].points), min});
  });
  return {out};
}
function stayAnalysis(r, upPlaces, downPlaces, lastDiv){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  if (!rows.length) return null;
  const pa = promoAnalysis(r, upPlaces);
  const ra = lastDiv ? {out: []} : (relegAnalysis(r, downPlaces) || {out: []});
  const upSet = new Set((pa ? pa.out : []).map(x => x.nom));
  const downSet = new Set(ra.out.map(x => x.nom));
  const n = rows.length;
  const out = [];
  rows.forEach((x, i) => {
    const inUpZone = i < upPlaces, inDownZone = !lastDiv && i >= n - downPlaces;
    if (inUpZone || inDownZone) return;                 // actuellement en zone de montée ou de descente
    const st = (!upSet.has(x.nom) && !downSet.has(x.nom)) ? "s" : "s2";
    out.push({...x, st, up: upSet.has(x.nom), down: downSet.has(x.nom)});
  });
  return {out};
}

function renderLive(){
  const main = $("main");
  const now = Date.now();
  const all = S.lives || [];
  const ess = all.filter(liveIsEssonne);
  const shown = S.liveAll ? all : ess;
  const words = norm(S.q).split(/\s+/).filter(Boolean);
  const shownF = shown.filter(l => !words.length || words.every(w => norm([l.teamName_home, l.teamName_out, l.competitionName].join(" ")).includes(w)));
  // matchs de l'Essonne commencés selon l'horaire (sans live FFBB)
  const liveIds = new Set(all.map(l => String(l.matchId)));
  const enCours = filtered().filter(m => m.date && !m.joue && !liveIds.has(m.id) && m.date.getTime() <= now && now - m.date.getTime() < 2.25*3600e3 && !(m.date.getHours() === 0 && m.date.getMinutes() === 0));
  const finis = filtered().filter(m => m.joue && m.date && now - m.date.getTime() < 4*3600e3).sort((a,b) => b.date - a.date);
  let html = `<div class="chips"><button class="chip ${!S.liveAll?"on":""}" data-liveall="0">Essonne (${ess.length})</button><button class="chip ${S.liveAll?"on":""}" data-liveall="1">Toute la France (${all.length})</button></div>`;
  html += `<div class="stat">${S.liveAt ? "Mis à jour à " + new Date(S.liveAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " · actualisation auto toutes les 30 s" : "Chargement du direct…"}</div>`;
  if (S.liveErr) html += `<div class="stat">⚠️ ${esc(S.liveErr)}</div>`;
  if (shownF.length){
    html += `<div class="day">● Scores en direct</div>` + shownF.map(liveCard).join("");
  } else if (S.lives){
    html += `<div class="empty" style="padding:20px">Aucun score en direct ${S.liveAll ? "en France" : "en Essonne"} pour le moment.<br><span class="stat">Le direct n'existe que pour les matchs suivis en e-Marque V2 avec statistiques live.</span></div>`;
  }
  if (enCours.length){
    html += `<div class="day">⏱ En cours (d'après l'horaire)</div><div class="stat">Score publié par la FFBB à la fin du match.</div>` + enCours.sort((a,b) => a.date - b.date).map(matchCard).join("");
  }
  if (finis.length){
    html += `<div class="day">✔ Terminés récemment</div>` + finis.map(matchCard).join("");
  }
  if (!shownF.length && !enCours.length && !finis.length && S.lives){
    const next = filtered().filter(m => m.date && m.date.getTime() > now).sort((a,b) => a.date - b.date)[0];
    if (next) html += `<div class="stat">Prochain match : ${esc(fmtDay(next.date))} à ${esc(next.date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}))}</div>` + matchCard(next);
  }
  main.innerHTML = html;
}

S.nbaDay = null; S.nba = null; S.nbaErr = null; S.nbaLoading = false; S.nbaAt = 0;
let nbaTimer = null;
function nbaDefaultDay(){
  // matchs NBA = soirée américaine = nuit en France : on décale de 10 h pour tomber sur « la nuit dernière »
  const d = new Date(Date.now() - 10*3600e3); d.setHours(12,0,0,0); return d;
}
function nbaKey(d){ const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
async function loadNba(silent){
  if (!S.nbaDay) S.nbaDay = nbaDefaultDay();
  if (!silent){ S.nbaLoading = true; S.nbaErr = null; renderMain(); }
  try{
    const j = await httpJson("GET", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + nbaKey(S.nbaDay), {});
    S.nba = (j.events || []).map(nbaNorm).sort((a,b) => a.date - b.date);
    S.nbaErr = null; S.nbaAt = Date.now();
  }catch(e){ S.nbaErr = e.message || String(e); if (!silent) S.nba = []; }
  S.nbaLoading = false;
  if (S.tab === "nba") renderMain();
  // actualisation auto toutes les 30 s s'il y a des matchs en cours
  clearTimeout(nbaTimer);
  if (S.tab === "nba" && (S.nba || []).some(g => g.state === "in")) nbaTimer = setTimeout(() => loadNba(true), 30000);
}
function nbaNorm(ev){
  const c = (ev.competitions && ev.competitions[0]) || {};
  const st = (ev.status && ev.status.type) || {};
  const team = cp => {
    const t = cp.team || {};
    const rec = (cp.records || []).find(r => r.type === "total" || r.name === "overall");
    return { nom: t.displayName || t.name || "?", abbr: t.abbreviation || "", logo: t.logo || "", score: cp.score,
             winner: cp.winner === true, record: rec ? rec.summary : "", ls: (cp.linescores || []).map(l => l.value != null ? l.value : l.displayValue) };
  };
  const comps = c.competitors || [];
  const home = comps.find(x => x.homeAway === "home") || comps[1] || {}, away = comps.find(x => x.homeAway === "away") || comps[0] || {};
  return { id: ev.id, date: new Date(ev.date), state: st.state || "pre", completed: !!st.completed, detail: st.shortDetail || st.detail || "",
           clock: ev.status && ev.status.displayClock, period: ev.status && ev.status.period,
           away: team(away), home: team(home), venue: c.venue ? [c.venue.fullName, c.venue.address && c.venue.address.city].filter(Boolean).join(" · ") : "",
           tv: (c.broadcasts || []).flatMap(b => b.names || []).join(", ") };
}
function nbaLogo(t){
  return t.logo ? `<img class="logo" loading="lazy" alt="" src="${esc(t.logo)}" onerror="this.outerHTML='<div class=&quot;logo ph&quot;>${esc(t.abbr)}</div>'">`
                : `<div class="logo ph">${esc(t.abbr || "?")}</div>`;
}
function nbaCard(g){

            : live ? `<div class="sc" style="color:#FF6B7F">${a} - ${h}</div><div class="st">● QT${esc(g.period)} · ${esc(g.clock || "")}</div>`
            : `<div class="hr">${hr}</div><div class="st">${esc(g.date.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))}</div>`;
  const qs = Math.max(g.away.ls.length, g.home.ls.length);

  return `<div class="match">
    <div class="top"><span class="cat" style="background:#1D428A;color:#fff">NBA</span><span class="comp">${esc(g.away.abbr)} @ ${esc(g.home.abbr)}${g.tv ? " · " + esc(g.tv) : ""}</span></div>
    <div class="teams">
      <div class="team ${done && a>h ? "win":""}">${nbaLogo(g.away)}<div class="nm">${esc(g.away.nom)}</div>${nbaStar(g.away)}<div class="st" style="font-size:11px;color:var(--mute)">${esc(g.away.record)}</div></div>
      <div class="mid">${mid}</div>
      <div class="team ${done && h>a ? "win":""}">${nbaLogo(g.home)}<div class="nm">${esc(g.home.nom)}</div>${nbaStar(g.home)}<div class="st" style="font-size:11px;color:var(--mute)">${esc(g.home.record)}</div></div>
    </div>
    ${lines}
    ${g.venue ? `<div class="gym">🏟 <span>${esc(g.venue)}</span></div>` : ""}
  </div>`;
}

function nbaStar(t){ const on = nbaFav(t); return `<button class="star mini ${on?"on":""}" data-fav="nba:${esc(t.abbr)}" data-favname="${esc(t.nom)}">${on?"★":"☆"}</button>`; }

/* ================= Scores en direct (flux FFBB lives.json) ================= */
S.liveMap = {}; S.liveStatus = "";  // "" inconnu, "ok", "blocked", "err"
function liveKey(a, b){ return norm(a) + "|" + norm(b); }
async function refreshLiveMap(){
  try{
    const r = await http("GET", API + "json/lives.json", {});
    if (r.status === 403){ S.liveStatus = "blocked"; return; }
    if (r.status < 200 || r.status >= 300){ S.liveStatus = "err"; return; }
    const j = JSON.parse(r.text || "[]"); const arr = Array.isArray(j) ? j : (j.data || []);
    const map = {};
    arr.forEach(l => { if (l.matchId != null) map["id:" + l.matchId] = l; map[liveKey(l.teamName_home, l.teamName_out)] = l; });
    S.liveMap = map; S.liveStatus = "ok";
  }catch(e){ S.liveStatus = "err"; }
}
function liveOf(m){ return S.liveMap["id:" + m.id] || S.liveMap[liveKey(m.t1.nom, m.t2.nom)] || null; }
function liveLabel(l){
  const st = String(l.matchStatus || l.currentStatus || "").toLowerCase();
  if (/fin|final|end|termin/.test(st)) return "Fin du match";
  if (/half|mi-temps/.test(st)) return "Mi-temps";
  const per = l.currentPeriod ? String(l.currentPeriod).replace(/^Q/i, "QT") : "";
  return [per, l.clock].filter(Boolean).join(" · ") || "En direct";
}

/* ================= Accueil : matchs en cours ================= */
S.homeAll = false; S.nbaHome = [];
function isLiveMatch(m, now){
  if (m.joue || !m.date) return false;
  if (m.date.getHours() === 0 && m.date.getMinutes() === 0) return false;
  const t = m.date.getTime();
  return t <= now && now - t < 2.25*3600e3;
}
function homeToggle(nAll){
  const now = Date.now();
  const nLive = filtered().filter(m => isLiveMatch(m, now)).length + S.nbaHome.filter(g => g.state === "in").length;
  return `<div class="chips"><button class="chip ${!S.homeAll?"on":""}" data-home="live">● En cours (${nLive})</button><button class="chip ${S.homeAll?"on":""}" data-home="all">Tout le week-end (${nAll})</button></div>`;
}
async function refreshNbaHome(){

    const j = await httpJson("GET", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + nbaKey(nbaDefaultDay()), {});

function renderHome(list){

  let html = homeToggle(list.length) + ffbbEssonneBanner();
  if (live.length){

/* ================= Probabilités de montée / descente (simulation) ================= */
S.proba = {};
const SIMS = 5000, HOME_ADV = 3, SPREAD = 12;   // avantage du terrain (pts) et dispersion des écarts
function simulatePoule(r, upPl, downPl, noDown){
  const rows = (r.rows || []).slice().sort((a,b) => (a.position||99) - (b.position||99));
  const n = rows.length;
  if (n < 2) return null;
  const ms = r.matches || [];
  if (r.partial || !ms.length) return {error: "Calendrier complet de la poule indisponible : calcul impossible."};
  const idx = {}; rows.forEach((x, i) => idx[norm(x.nom)] = i);
  const remaining = ms.filter(m => !m.joue).map(m => [idx[norm(m.t1.nom)], idx[norm(m.t2.nom)]]).filter(p => p[0] != null && p[1] != null);
  // force de chaque équipe : écart moyen par match, ramené vers 0 en début de saison
  const rating = rows.map(x => (x.diff || 0) / ((x.joues || 0) + 2));
  const pWin = remaining.map(([h, a]) => 1 / (1 + Math.exp(-((rating[h] + HOME_ADV) - rating[a]) / SPREAD)));
  const up = new Array(n).fill(0), down = new Array(n).fill(0);
  const pts = new Array(n), order = rows.map((_, i) => i);
  for (let s = 0; s < SIMS; s++){
    for (let i = 0; i < n; i++) pts[i] = rows[i].points || 0;
    for (let k = 0; k < remaining.length; k++){
      const [h, a] = remaining[k];
      if (Math.random() < pWin[k]){ pts[h] += 2; pts[a] += 1; } else { pts[a] += 2; pts[h] += 1; }
    }
    // égalités : goal-average particulier si déjà décidé, sinon goal-average général, sinon tirage
    const tie = order.map(() => Math.random());
    order.sort((i, j) => (pts[j] - pts[i]) || tieBreak(rows[i], rows[j], ms) || (rows[j].diff - rows[i].diff) || (tie[i] - tie[j]));
    for (let p = 0; p < Math.min(upPl, n); p++) up[order[p]]++;
    if (!noDown) for (let p = Math.max(0, n - downPl); p < n; p++) down[order[p]]++;
  }
  return {rows: rows.map((x, i) => ({...x, up: 100 * up[i] / SIMS, down: noDown ? null : 100 * down[i] / SIMS})), remaining: remaining.length};
}
function tieBreak(a, b, ms){ const t = winsTie(a, b, ms); return t === true ? -1 : t === false ? 1 : 0; }
function pct(v){
  if (v == null) return "–";
  if (v >= 99.95) return "100 %"; if (v <= 0.05) return "0 %";
  if (v < 1) return "< 1 %"; if (v > 99) return "> 99 %";
  return Math.round(v) + " %";
}
function bar(v, cls){ return `<div class="pbar"><i class="${cls}" style="width:${Math.max(0, Math.min(100, v || 0))}%"></i><span>${pct(v)}</span></div>`; }
function renderProba(list){

      }
      html += `</div>`;

  }
  html += `<div class="stat">Calcul : ${SIMS.toLocaleString("fr-FR")} fins de saison simulées. Chance de gagner un match selon l'écart moyen de points de chaque équipe, avec un avantage de ${HOME_ADV} pts à domicile. Victoire 2 pts, défaite 1 pt ; égalités au goal-average. Ce sont des estimations, pas des certitudes.</div>`;
  main.innerHTML = html;
}

function loadSeason(force){
  if (force){ S.season = null; seasonPromise = null; }

  seasonPromise = (async () => {

        {date_rencontre: {_gte: isoLocal(SEASON_START)}},

      ]});
      let out = [], page = 1;
      while (page <= 12){
        const j = await directusGet("items/ffbbserver_rencontres", RENC_FIELDS, ["limit=1000", "page=" + page, "sort[]=date_rencontre", "filter=" + encodeURIComponent(filter)]);
        const d = (j && j.data) || [];

      }
      S.season = out.map(normalize).filter(m => m.date && m.date >= SEASON_START);

function categoryAverage(m){
  if (!S.season || !S.season.length || !m) return null;
  let pts = 0, n = 0;
  S.season.forEach(x => {
    if (x.cat.code !== m.cat.code || x.sexe !== m.sexe) return;
    const a = parseInt(x.t1.score, 10), b = parseInt(x.t2.score, 10);
    if (!isNaN(a) && !isNaN(b)){ pts += a + b; n += 2; }
  });
  return n >= 10 ? pts / n : null;
}

/* ================= Style de jeu (déduit des scores) ================= */
// Les noms FFBB ne contiennent pas la catégorie (« CO SAVIGNY - 1 » existe en U11, U13, Seniors…) :
// une équipe = nom + catégorie + sexe.
function ctxStr(cat, sexe){ return (cat && cat.code ? cat.code : cat || "") + "|" + (sexe || ""); }
function parseCtx(c){ if (!c) return null; const [cat, sexe] = String(c).split("|"); return cat ? {cat, sexe: sexe || ""} : null; }
function inCtx(m, ctx){ return !ctx || (m.cat.code === ctx.cat && (!ctx.sexe || !m.sexe || m.sexe === ctx.sexe)); }
function teamPouleKey(name, ctx){
  const n = norm(name);
  const m = allKnown().filter(x => (norm(x.t1.nom) === n || norm(x.t2.nom) === n) && inCtx(x, ctx)).sort((a,b) => (b.date||0) - (a.date||0))[0];
  if (!m) return null;
  return {pk: m.pouleId || (divisionKey(m) + "|" + m.poule), m};
}
function playedOf(name, extra, ctx, clubId){
  const pool = (S.season || []).concat(allKnown(), ...Object.values(S.ranks).map(r => r.matches || []), extra || [])
    .filter(m => m.joue && (!m.date || m.date >= SEASON_START) && inCtx(m, ctx));
  const collect = test => {
    const seen = {}, out = [];
    pool.forEach(m => {
      if (seen[m.id]) return;
      const s1 = parseInt(m.t1.score, 10), s2 = parseInt(m.t2.score, 10); if (isNaN(s1) || isNaN(s2)) return;
      const home = test(m.t1), away = test(m.t2); if (!home && !away) return;
      seen[m.id] = 1;
      out.push({m, home, pf: home ? s1 : s2, pa: home ? s2 : s1, opp: home ? m.t2.nom : m.t1.nom, date: m.date});
    });
    return out.sort((a,b) => (a.date||0) - (b.date||0));
  };
  const n = norm(name);
  let out = collect(t => norm(t.nom) === n);
  // nom du classement différent de celui des matchs : on passe par le club s'il n'a qu'une équipe dans la catégorie
  if (!out.length && clubId){
    const names = new Set(); pool.forEach(m => [m.t1, m.t2].forEach(t => { if (t.clubId === clubId) names.add(norm(t.nom)); }));
    if (names.size === 1) out = collect(t => t.clubId === clubId);
  }
  return out;
}
function pouleAverages(r){
  const ms = ((r && r.matches) || []).filter(m => m.joue);
  let pts = 0, n = 0;
  ms.forEach(m => { const a = parseInt(m.t1.score,10), b = parseInt(m.t2.score,10); if (!isNaN(a) && !isNaN(b)){ pts += a + b; n += 2; } });
  return n ? pts / n : null;   // points marqués moyens par équipe et par match dans la poule
}
function teamStyle(name, r, ctx, clubId){
  const g = playedOf(name, r && r.matches, ctx, clubId);
  if (!g.length) return null;
  const N = g.length, wins = g.filter(x => x.pf > x.pa), margins = g.map(x => x.pf - x.pa);
  const ppg = g.reduce((s,x) => s + x.pf, 0) / N, papg = g.reduce((s,x) => s + x.pa, 0) / N;
  const avgM = margins.reduce((s,x) => s + x, 0) / N;
  const sd = Math.sqrt(margins.reduce((s,x) => s + (x - avgM) ** 2, 0) / N);
  const close = g.filter(x => Math.abs(x.pf - x.pa) <= 6), closeW = close.filter(x => x.pf > x.pa).length;
  const H = g.filter(x => x.home), A = g.filter(x => !x.home);
  const hw = H.filter(x => x.pf > x.pa).length, aw = A.filter(x => x.pf > x.pa).length;
  const big = g.reduce((b,x) => (x.pf - x.pa) > (b ? b.pf - b.pa : -1e9) ? x : b, null);
  const worst = g.reduce((b,x) => (x.pf - x.pa) < (b ? b.pf - b.pa : 1e9) ? x : b, null);
  const avg = categoryAverage(g[g.length - 1].m) || pouleAverages(r) || (ppg + papg) / 2;
  const last = g.slice(-5);
  const tags = [];
  const off = ppg >= avg * 1.12, def = papg <= avg * 0.88;
  if (off && def) tags.push(["⭐", "Complète", "attaque et défense au-dessus de la moyenne de la poule"]);
  else if (off) tags.push(["🔥", "Offensive", `marque ${Math.round((ppg/avg - 1)*100)} % de points de plus que la moyenne`]);
  else if (def) tags.push(["🛡", "Défensive", `encaisse ${Math.round((1 - papg/avg)*100)} % de points de moins que la moyenne`]);
  if (ppg <= avg * 0.85) tags.push(["🧊", "Attaque en panne", "marque peu de points"]);
  if (papg >= avg * 1.15) tags.push(["🚪", "Défense perméable", "encaisse beaucoup de points"]);
  const wr = wins.length / N;
  if (wr >= 0.7 && avgM >= 15) tags.push(["🚜", "Rouleau compresseur", `gagne avec ${Math.round(avgM)} pts d'écart en moyenne`]);
  if (close.length >= 2){
    if (closeW / close.length >= 0.65) tags.push(["🧠", "Solide dans les fins serrées", `${closeW}/${close.length} matchs serrés gagnés`]);
    else if (closeW / close.length <= 0.35) tags.push(["😬", "Fragile dans les fins serrées", `${closeW}/${close.length} matchs serrés gagnés`]);
  }
  if (H.length >= 2 && A.length >= 2){
    const d = hw / H.length - aw / A.length;
    if (d >= 0.34) tags.push(["🏠", "Forte à domicile", `${hw}/${H.length} à domicile, ${aw}/${A.length} à l'extérieur`]);
    else if (d <= -0.34) tags.push(["✈️", "Meilleure à l'extérieur", `${aw}/${A.length} à l'extérieur, ${hw}/${H.length} à domicile`]);
  }
  if (N >= 4){
    if (sd <= 8) tags.push(["📏", "Régulière", "écarts de score très constants"]);
    else if (sd >= 20) tags.push(["🎢", "Irrégulière", "résultats très variables d'un match à l'autre"]);
  }
  if (last.length >= 3){
    const lw = last.slice(-3).filter(x => x.pf > x.pa).length;
    if (lw === 3) tags.push(["📈", "En forme", "3 victoires de suite"]);
    else if (lw === 0) tags.push(["📉", "En difficulté", "3 défaites de suite"]);
  }
  if (!tags.length) tags.push(["⚖️", "Équilibrée", "dans la moyenne de sa poule"]);
  return {N, w: wins.length, l: N - wins.length, ppg, papg, avgM, sd, close, closeW, H, A, hw, aw, big, worst, last, avg, tags};
}

    return;
  }
  const all = []; tree.forEach(c => c.divs.forEach(d => d.poules.forEach(e => all.push(e))));
  if (S.cat === "ALL" && tree.length > 1){
    main.innerHTML = `<div class="empty">Choisis une catégorie ci-dessus (U11, U13, Seniors…)<br>pour voir le style de jeu actuel de chaque équipe.<br><br><span class="stat">${all.length} poules au total</span></div>`;
    return;
  }
  if (!S.season){ loadSeason(); main.innerHTML = `<div class="load"><div class="spinner"></div>Récupération de tous les matchs depuis le 1er septembre 2026…</div>`; return; }
  queueRankings(all);
  const done = all.filter(([pk]) => S.ranks[pk] && !S.ranks[pk].loading).length;
  let html = `<div class="stat">${S.season.length ? `Depuis le <b>1er septembre 2026</b> · ${S.season.length.toLocaleString("fr-FR")} matchs analysés (toutes phases)` : `⚠️ Matchs depuis septembre indisponibles (${esc(S.seasonErr || "?")}) : styles calculés sur les matchs récents seulement`} · ${done}/${all.length} poules</div>`;
  if (done < all.length) html += `<div class="prog"><i style="width:${Math.round(100*done/all.length)}%"></i></div>`;
  const words = norm(S.q).split(/\s+/).filter(Boolean);
  for (const c of tree){
    html += `<div class="day">${esc(prettyCat(c.cat))}</div>`;
    for (const d of c.divs){
      html += `<div class="div"><div class="hd">${esc(d.nom)}</div>`;
      for (const [pk, p] of d.poules){
        const r = S.ranks[pk];
        html += `<div class="pl"><div class="ph2">${esc(p.nom)}</div>`;
        if (!r || r.loading){ html += `<div class="mini">Analyse en cours…</div></div>`; continue; }
        // équipes : ordre du classement si disponible, sinon celles vues dans les matchs
        const names = (r.rows && r.rows.length) ? r.rows.map(x => x.nom) : Object.keys(p.teams);
        const items = names.filter(n => !words.length || words.every(w => norm(n).includes(w))).map(n => ({n, st: teamStyle(n, r, {cat: p.cat.code, sexe: p.sexe}, ((r.rows || []).find(x => x.nom === n) || {}).clubId), t: p.teams[n] || Object.values(p.teams).find(t => norm(t.nom) === norm(n)) || {nom: n}}));
        if (!items.length){ html += `</div>`; continue; }
        html += items.map(({n, st, t}) => `<div class="srow" data-style="${esc(n)}" data-sctx="${esc(ctxStr(p.cat, p.sexe))}" data-sclub="${esc(((r.rows || []).find(x => x.nom === n) || {}).clubId || t.clubId || "")}">${logoHtml(t)}<div class="sinfo"><b>${esc(n)}</b>
            ${st ? `<div class="stl">${st.tags.slice(0, 3).map(([i, l]) => `<span class="badge2 b-p">${i} ${esc(l)}</span>`).join("")}</div>
            <div class="ssub">${st.w} V – ${st.l} D · ${(Math.round(st.ppg*10)/10).toLocaleString("fr-FR")} marqués · ${(Math.round(st.papg*10)/10).toLocaleString("fr-FR")} encaissés <span class="sform">${st.last.map(x => `<span class="form ${x.pf > x.pa ? "fw" : "fl"}">${x.pf > x.pa ? "V" : "D"}</span>`).join("")}</span></div>`
                 : `<div class="ssub">Pas encore de match joué</div>`}</div></div>`).join("");
        html += `</div>`;
      }
      html += `</div>`;
    }
  }
  html += `<div class="stat">Touche une équipe pour le détail. Styles déduits uniquement des scores.</div>`;
  main.innerHTML = html;
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.basket91.app'
    compileSdk 34

    defaultConfig {
        applicationId "fr.basket91.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        fixe {
            // Clé fixe : chaque nouvelle version s'installe par-dessus la précédente
            storeFile file('basket91.keystore')
            storePassword 'basket91pass'
            keyAlias 'basket91'
            keyPassword 'basket91pass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
